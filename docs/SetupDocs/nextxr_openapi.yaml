      summary: Derive the parts list and lead times for a work order
      operationId: copilotProcurement
      requestBody: { $ref: '#/components/requestBodies/CopilotState' }
      responses:
        '200': { $ref: '#/components/responses/AgentReply' }

  /api/v1/copilot/incident-report:
    post:
      tags: [copilot]
      summary: Formal incident narrative from findings and diagnostics
      operationId: copilotIncidentReport
      requestBody: { $ref: '#/components/requestBodies/CopilotState' }
