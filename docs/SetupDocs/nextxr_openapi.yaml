        '200': { $ref: '#/components/responses/AgentReply' }

  /api/v1/copilot/troubleshoot:
    post:
      tags: [copilot]
      summary: Mechanic chat grounded in live diagnostics
      operationId: copilotTroubleshoot
      requestBody: { $ref: '#/components/requestBodies/CopilotChat' }
      responses:
        '200': { $ref: '#/components/responses/AgentReply' }

  /api/v1/copilot/dashboard-chat:
    post:
      tags: [copilot]
      summary: Operator chat grounded in a twin snapshot
      operationId: copilotDashboardChat
      requestBody: { $ref: '#/components/requestBodies/CopilotChat' }
      responses:
        '200': { $ref: '#/components/responses/AgentReply' }

  # ==========================================================================
  # agents
  # ==========================================================================
  /api/v1/agents/info:
    get:
      tags: [agents]
      summary: Agent layer capabilities and model policy
      operationId: agentsInfo
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }

  /api/v1/agents/twin/start:
    post:
      tags: [agents]
      summary: Open a twin-builder session
      operationId: twinStart
      requestBody: { $ref: '#/components/requestBodies/AgentStart' }
      responses:
        '200': { $ref: '#/components/responses/AgentSession' }

  /api/v1/agents/twin/message:
    post:
      tags: [agents]
      summary: Advance the twin-builder conversation
      operationId: twinMessage
      requestBody: { $ref: '#/components/requestBodies/AgentMessage' }
      responses:
        '200': { $ref: '#/components/responses/AgentSession' }

  /api/v1/agents/twin/{session_id}:
    get:
      tags: [agents]
      summary: Twin-builder session state
      operationId: twinSessionState
      parameters: [ { $ref: '#/components/parameters/SessionId' } ]
      responses:
        '200': { $ref: '#/components/responses/AgentSession' }

  /api/v1/agents/twin/expand:
    post:
      tags: [agents]
      summary: Expand an agreed specification into seeded entities
      operationId: twinExpand
      requestBody: { $ref: '#/components/requestBodies/AgentMessage' }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }

  /api/v1/agents/twin/upload:
    post:
      tags: [agents]
      summary: Upload a photo or plan and derive a TwinSpec
      description: |
        Object photos route to the 3-D reconstruction pipeline (TRELLIS on
        RunPod) so the twin renders the real model; floor plans route to the
        2d-to-3d parser and produce a BIM scene graph.
      operationId: twinUpload
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                tenant: { type: string }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }

  /api/v1/agents/twin/scene:
    post:
      tags: [agents]
      summary: Request a 3-D scene build
      operationId: twinRequestScene
      requestBody: { $ref: '#/components/requestBodies/AgentMessage' }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }

  /api/v1/agents/twin/scene/{tenant}:
    get:
      tags: [agents]
      summary: Fetch the cached BIM scene for a tenant
      description: Served from the shared `scene_cache` table, so every task returns the same scene.
      operationId: twinSceneByTenant
      parameters: [ { $ref: '#/components/parameters/TenantPath' } ]
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }

  /api/v1/agents/twin/build-from-plan:
    post:
      tags: [agents]
      summary: Synchronous 2-D plan to 3-D building
      operationId: twinBuildFromPlan
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                tenant: { type: string }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }

  /api/v1/agents/twin/build-from-plan/start:
    post:
      tags: [agents]
      summary: Start an asynchronous plan build
      operationId: twinBuildFromPlanStart
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                tenant: { type: string }
      responses:
        '202':
          description: Accepted; poll the status endpoint
          content:
            application/json:
              schema:
                type: object
                properties:
                  build_id: { type: string }

  /api/v1/agents/twin/build-from-plan/status/{build_id}:
    get:
      tags: [agents]
      summary: Plan-build progress
      operationId: twinBuildFromPlanStatus
      parameters:
        - name: build_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }

  /api/v1/agents/twin/sample-scene/{facility}:
    get:
      tags: [agents]
      summary: Sample scene for a facility type
      operationId: twinSampleScene
      parameters:
        - name: facility
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }

  /api/v1/agents/bundle/start:
    post:
      tags: [agents]
      summary: Open a bundle-author session
      operationId: bundleStart
      requestBody: { $ref: '#/components/requestBodies/AgentStart' }
      responses:
        '200': { $ref: '#/components/responses/AgentSession' }

  /api/v1/agents/bundle/message:
    post:
      tags: [agents]
      summary: Advance bundle authoring
      operationId: bundleMessage
      requestBody: { $ref: '#/components/requestBodies/AgentMessage' }
      responses:
        '200': { $ref: '#/components/responses/AgentSession' }

  /api/v1/agents/bundle/approve:
    post:
      tags: [agents]
      summary: Approve and publish a capability bundle
      description: |
        Persisted to the shared relational store, so a bundle published by one
        task is immediately loadable by every other task.
      operationId: bundleApprove
      requestBody: { $ref: '#/components/requestBodies/AgentMessage' }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }

  /api/v1/agents/bundle/{session_id}:
    get:
      tags: [agents]
      summary: Bundle-author session state
      operationId: bundleSessionState
      parameters: [ { $ref: '#/components/parameters/SessionId' } ]
      responses:
        '200': { $ref: '#/components/responses/AgentSession' }

  /api/v1/agents/ops/diagnose:
    post:
      tags: [agents]
      summary: Run the operational diagnosis graph
      operationId: opsDiagnose
      requestBody: { $ref: '#/components/requestBodies/AgentMessage' }
      responses:
        '200': { $ref: '#/components/responses/AgentSession' }

  /api/v1/agents/ops/analysis:
    post:
      tags: [agents]
      summary: Run the operational analysis graph
      operationId: opsAnalysis
      requestBody: { $ref: '#/components/requestBodies/AgentMessage' }
      responses:
        '200': { $ref: '#/components/responses/AgentSession' }

  /api/v1/agents/ops/cascade:
    post:
      tags: [agents]
      summary: Run the cascade-projection graph
      operationId: opsCascade
      requestBody: { $ref: '#/components/requestBodies/AgentMessage' }
      responses:
        '200': { $ref: '#/components/responses/AgentSession' }

  /api/v1/agents/ops/{session_id}:
    get:
      tags: [agents]
      summary: Operational session state
      operationId: opsSessionState
      parameters: [ { $ref: '#/components/parameters/SessionId' } ]
      responses:
        '200': { $ref: '#/components/responses/AgentSession' }

  /api/v1/agents/plugin/start:
    post:
      tags: [agents]
      summary: Open a plugin session (extend a live twin with a pack or adapter)
      operationId: pluginStart
      requestBody: { $ref: '#/components/requestBodies/AgentStart' }
      responses:
        '200': { $ref: '#/components/responses/AgentSession' }

  /api/v1/agents/plugin/message:
    post:
      tags: [agents]
      summary: Advance plugin authoring
      operationId: pluginMessage
      requestBody: { $ref: '#/components/requestBodies/AgentMessage' }
      responses:
        '200': { $ref: '#/components/responses/AgentSession' }

  /api/v1/agents/plugin/{session_id}:
    get:
      tags: [agents]
      summary: Plugin session state
      operationId: pluginSessionState
      parameters: [ { $ref: '#/components/parameters/SessionId' } ]
      responses:
        '200': { $ref: '#/components/responses/AgentSession' }

  /api/v1/agents/accelerator/start:
    post:
      tags: [agents]
      summary: Open a vertical-accelerator session
      operationId: acceleratorStart
      requestBody: { $ref: '#/components/requestBodies/AgentStart' }
      responses:
        '200': { $ref: '#/components/responses/AgentSession' }

  /api/v1/agents/accelerator/message:
    post:
      tags: [agents]
      summary: Advance the accelerator
      operationId: acceleratorMessage
      requestBody: { $ref: '#/components/requestBodies/AgentMessage' }
      responses:
        '200': { $ref: '#/components/responses/AgentSession' }

  /api/v1/agents/accelerator/{session_id}:
    get:
      tags: [agents]
      summary: Accelerator session state
      operationId: acceleratorSessionState
      parameters: [ { $ref: '#/components/parameters/SessionId' } ]
      responses:
        '200': { $ref: '#/components/responses/AgentSession' }

  # ==========================================================================
  # hub
  # ==========================================================================
  /api/v1/predict:
    post:
      tags: [hub]
      summary: Hub-facing prediction surface
      operationId: hubPredict
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }

  /api/v1/assets/{asset_id}/ar-overlay:
    get:
      tags: [hub]
      summary: AR overlay payload for an asset
      operationId: hubArOverlay
      parameters:
        - name: asset_id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/TenantQuery'
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }

  # ==========================================================================
  # feed
  # ==========================================================================
  /api/v1/feed/start:
    post:
      tags: [feed]
      summary: Start the deterministic simulated feed
      operationId: startFeed
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tenant: { type: string }
                domain: { type: string }
                speed: { type: number, description: "Sim-time multiplier; 60 = one real second is one sim-minute" }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }

  /api/v1/feed/status:
    get:
      tags: [feed]
      summary: Feed counters and per-signal latest values
      operationId: feedStatus
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }

  /api/v1/feed/stop:
    post:
      tags: [feed]
      summary: Stop the simulated feed
      operationId: stopFeed
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }

  # ==========================================================================
  # threed  (mounted sub-application)
  # ==========================================================================
  /api/v1/threed/api/health:
    get:
      tags: [threed]
      summary: 3-D platform health
      operationId: threedHealth
      security: []
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }

  /api/v1/threed/api/priors:
    get:
      tags: [threed]
      summary: List reconstruction priors
      operationId: threedListPriors
      responses:
        '200': { $ref: '#/components/responses/JsonArray' }
    post:
      tags: [threed]
      summary: Add a reconstruction prior
      operationId: threedAddPrior
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '201': { $ref: '#/components/responses/JsonObject' }

  /api/v1/threed/api/jobs:
    get:
      tags: [threed]
      summary: List reconstruction jobs
      operationId: threedListJobs
      responses:
        '200': { $ref: '#/components/responses/JsonArray' }
    post:
      tags: [threed]
      summary: Create a reconstruction job (photo to GLB)
      description: |
        The job record goes to the shared relational store, not task disk, so a
        browser polling through the load balancer cannot get a 404 from a task
        that did not run the job.
      operationId: threedCreateJob
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThreedJob' }
          description: Job created

  /api/v1/threed/api/jobs/{job_id}:
    get:
      tags: [threed]
      summary: Job status and per-stage progress
      operationId: threedGetJob
      parameters: [ { $ref: '#/components/parameters/JobId' } ]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThreedJob' }
          description: The job

  /api/v1/threed/api/jobs/{job_id}/file/{path}:
    get:
      tags: [threed]
      summary: Fetch one job artifact
      operationId: threedGetFile
      parameters:
        - $ref: '#/components/parameters/JobId'
        - name: path
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The artifact
          content:
            application/octet-stream:
              schema: { type: string, format: binary }

  /api/v1/threed/api/jobs/{job_id}/result:
    get:
      tags: [threed]
      summary: The finished GLB
      description: |
        Redirects (302) to a presigned S3 URL when the blob backend is S3, so a
        20 MB GLB streams from S3 instead of occupying an API worker.
      operationId: threedGetResult
      parameters: [ { $ref: '#/components/parameters/JobId' } ]
      responses:
        '302':
          description: Redirect to a presigned S3 URL
          headers:
            Location:
              schema: { type: string, format: uri }
        '200':
          description: The GLB, served directly on the local-filesystem backend
          content:
            model/gltf-binary:
              schema: { type: string, format: binary }

components:

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Carries a role (`admin` / `write` / `read`) and a tenant scope. Configured
        via `NXR_API_KEYS`.
    DeviceToken:
      type: apiKey
      in: header
      name: X-Device-Token
      description: |
        A telemetry device credential: one verb (append), one tenant, optionally
        one asset prefix. Returned once at registration; only the hash is stored.

  parameters:
    TenantQuery:
      name: tenant
      in: query
      required: true
      schema: { type: string }
      description: Tenant id; must be inside the caller's key scope
    TenantPath:
      name: tenant
      in: path
      required: true
      schema: { type: string }
      description: Tenant id; checked against the caller's key scope after routing
    NodeId:
      name: node_id
      in: path
      required: true
      schema: { type: string }
    ClassName:
      name: name
      in: path
      required: true
      schema: { type: string }
      description: Ontology class local name (e.g. AirHandler)
    DeviceId:
      name: device_id
      in: path
      required: true
      schema: { type: string }
    ConnectorId:
      name: connector_id
      in: path
      required: true
      schema: { type: string }
    SessionId:
      name: session_id
      in: path
      required: true
      schema: { type: string }
    JobId:
      name: job_id
      in: path
      required: true
      schema: { type: string }

  requestBodies:
    CopilotState:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CopilotRequest' }
    CopilotChat:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/CopilotRequest'
              - type: object
                properties:
                  message: { type: string }
                  history:
                    type: array
                    items:
                      type: object
                      properties:
                        role: { type: string, enum: [user, assistant] }
                        content: { type: string }
    AgentStart:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              tenant: { type: string }
              message: { type: string }
    AgentMessage:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              tenant: { type: string }
              session_id: { type: string }
              message: { type: string }

  responses:
    JsonObject:
      description: Success
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
    JsonArray:
      description: Success
      content:
        application/json:
          schema:
            type: array
            items: { type: object, additionalProperties: true }
    AgentReply:
      description: |
        The agent's answer. The `ai` block reports `backend` — `claude` when the
        call reached the API, `stub` when it degraded to the deterministic
        fallback (keyless, over budget, or on any network or parse failure). A
        stub answer is never silently presented as real reasoning.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AgentResponse' }
    AgentSession:
      description: Agent graph session state, checkpointed by thread_id
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
    Unauthorized:
      description: Missing or invalid credential
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Tenant outside the caller's key scope, or role insufficient
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationFailed:
      description: SHACL validation failed; nothing was written
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationReport' }
    GraphUnavailable:
      description: |
        Neo4j is unreachable. Converted once, globally, from the driver's
        connection errors so every graph-backed route degrades the same way.
      content:
        application/json:
          schema:
            type: object
            properties:
              detail: { type: string }
              neo4j: { type: string, example: unreachable }

  schemas:

    Ack:
      type: object
      properties:
        ok: { type: boolean }
        detail: { type: string }

    Error:
      type: object
      properties:
        detail: { type: string }

    Entity:
      type: object
      properties:
        id: { type: string }
        tenantId: { type: string }
        label:
          type: string
          description: The taxonomy category used as the Neo4j label
          enum: [PhysicalAsset, MobileAsset, Actor, Location, Process, Observation, Finding, Incident, Document, Capability]
        canonicalType:
          type: string
          description: The OWL class IRI
          example: https://ontology.nextxr.io/v3/solar#PVArray
        displayName: { type: string }
        status: { type: string }
        updatedAt: { type: string, format: date-time }
        properties:
          type: object
          additionalProperties: true
          description: Class properties plus live signal values written by the runtime

    EntityCreate:
      type: object
      required: [tenant, canonical_type, properties]
      properties:
        tenant: { type: string }
        canonical_type: { type: string }
        properties: { type: object, additionalProperties: true }

    Finding:
      type: object
      properties:
        id: { type: string }
        behaviourId: { type: string, example: solar.soiling_symmetric_drop }
        tier:
          type: string
          enum: [A, B, C]
          description: A = physics residual, B = statistical baseline, C = deterministic rule
        severity: { type: string, enum: [info, warning, critical] }
        entityId: { type: string }
        evidence: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }

    ChangeEvent:
      type: object
      properties:
        seq: { type: integer, format: int64 }
        event_id: { type: string, description: ULID }
        tenant_id: { type: string }
        entity_id: { type: string }
        entity_type: { type: string }
        actor: { type: string }
        action: { type: string, enum: [create, update, delete] }
        field_changes:
          type: object
          additionalProperties:
            type: object
            properties:
              old: {}
              new: {}
        ts: { type: string, format: date-time }
        prev_event_hash: { type: string }
        wm_hash: { type: string, description: sha256 over canonical content including prev_event_hash }

    BusEvent:
      type: object
      properties:
        event_id: { type: string }
        tenant_id: { type: string }
        entity_id: { type: string }
        entity_type: { type: string }
        label: { type: string }
        action: { type: string, enum: [create, update, delete] }
        actor: { type: string }
        ts: { type: string, format: date-time }

    BusInfo:
      type: object
      properties:
        backend: { type: string, enum: [redis, memory, null] }
        required: { type: boolean }
        scale_safe:
          type: boolean
          description: False on the in-memory bus — correct in one process, wrong at two tasks
        url: { type: string, description: Redacted Redis URL when the backend is redis }

    HistorianInfo:
      type: object
      properties:
        backend: { type: string, enum: [timescale, postgres, sqlite] }
        timescale_version: { type: string }
        required: { type: boolean }
        scale_safe: { type: boolean }
        samples: { type: integer }
        earliest: { type: string, format: date-time }
        latest: { type: string, format: date-time }
        bad_quality_share: { type: number }

    Health:
      type: object
      properties:
        status: { type: string, enum: [healthy, degraded] }
        neo4j: { type: string, enum: [connected, unreachable] }
        database:
          type: object
          description: Backend, redacted endpoint, pool bounds and reachability
          additionalProperties: true
        blobs:
          type: object
          description: Backend, bucket/prefix and a real write + read + delete probe
          additionalProperties: true
        bus: { $ref: '#/components/schemas/BusInfo' }
        historian: { $ref: '#/components/schemas/HistorianInfo' }
        twin_runtime:
          type: object
          description: |
            Which twins THIS task drives. Across the fleet every tenant should
            appear exactly once; a tenant in two tasks' `owned` lists means
            leases are not holding and findings are being written twice.
          properties:
            enabled: { type: boolean }
            owned:
              type: array
              items: { type: string }
        detail: { type: string }

    Twin:
      type: object
      properties:
        tenant_id: { type: string }
        name: { type: string }
        domain: { type: string }
        description: { type: string }
        created_at: { type: string, format: date-time }
        seed_asset_id: { type: string }

    DomainSpec:
      type: object
      properties:
        key: { type: string, example: solar-pv-array }
        label: { type: string, example: Enterprise Solar PV Array }
        class_iri: { type: string }
        control:
          type: string
          description: The controllable input (throttle, curtailment, service_level, ...)
        signals: { type: object, additionalProperties: { type: string } }
        units: { type: object, additionalProperties: { type: string } }
        faults: { type: array, items: { type: string } }
        sensors: { type: object, additionalProperties: true }
        subsystems:
          type: array
          items:
            type: array
            items: { type: string }

    TwinState:
      type: object
      properties:
        tenant: { type: string }
        domain: { type: string }
        running: { type: boolean }
        control: { type: number }
        health_index: { type: number }
        faults: { type: array, items: { type: string } }
        signals:
          type: object
          additionalProperties:
            type: object
            properties:
              value: { type: number }
              unit: { type: string }
        ts: { type: string, format: date-time }

    Diagnostics:
      type: object
      properties:
        sensors:
          type: array
          items:
            type: object
            properties:
              signal: { type: string }
              value: { type: number }
              limit: { type: number }
              direction: { type: string, enum: [above, below] }
              status: { type: string, enum: [ok, warning, alarm] }
        subsystems:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
              health: { type: number }
        findings:
          type: array
          items: { $ref: '#/components/schemas/Finding' }

    TelemetrySample:
      type: object
      required: [asset_id, signal, value]
      properties:
        asset_id: { type: string }
        signal: { type: string }
        value: { type: number, nullable: true }
        unit: { type: string }
        quality:
          type: integer
          description: OPC quality byte — 0 BAD, 64 UNCERTAIN, 192 GOOD
          default: 192
          enum: [0, 64, 192]
        ts: { type: string, format: date-time }

    IngestResult:
      type: object
      properties:
        accepted: { type: integer }
        duplicates: { type: integer, description: Collided on the historian primary key and were skipped }
        rejected: { type: integer }
        behaviours_evaluated: { type: boolean }

    HistoryPoint:
      type: object
      properties:
        ts: { type: string, format: date-time }
        value: { type: number, nullable: true }
        count: { type: integer, description: Present on rollup resolutions }
        min: { type: number }
        max: { type: number }
        bad_count: { type: integer }
        unit: { type: string }

    Device:
      type: object
      properties:
        device_id: { type: string }
        tenant_id: { type: string }
        name: { type: string }
        asset_prefix: { type: string }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        created_by: { type: string }
        expires_at: { type: string, format: date-time, nullable: true }
        last_seen_at: { type: string, format: date-time, nullable: true }
        last_seen_ip: { type: string, nullable: true }
        samples_total: { type: number }
        rejected_total: { type: number }

    Connector:
      type: object
      properties:
        connector_id: { type: string }
        tenant_id: { type: string }
        protocol: { type: string, enum: [modbus_tcp, modbus_rtu, opcua, mqtt] }
        name: { type: string }
        enabled: { type: boolean }
        config:
          type: object
          additionalProperties: true
          description: |
            Endpoint, poll interval and point map. Credentials are removed by an
            ALLOW-list, not a deny-list, so a field added later cannot leak a
            customer's PLC password by omission.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ConnectorCreate:
      type: object
      required: [tenant, protocol, config]
      properties:
        tenant: { type: string }
        protocol: { type: string, enum: [modbus_tcp, modbus_rtu, opcua, mqtt] }
        name: { type: string }
        config: { type: object, additionalProperties: true }

    MaintenanceTrigger:
      type: object
      properties:
        signature: { type: string, example: Symmetric Output Drop }
        behavior_id: { type: string, example: solar.soiling_symmetric_drop }
        condition: { type: string, example: "ΔP < -12% across zone; V_dc normal; I_dc uniformly suppressed" }
        diagnosis: { type: string, example: Soiling / dust build-up }
        action: { type: string, example: Low-priority cleaning ticket }
        priority: { type: string, enum: [low, high, scheduled] }

    CopilotRequest:
      type: object
      properties:
        tenant:
          type: string
          description: Checked against the caller's key scope — request bodies are covered
        machine: { type: string }
        domain: { type: string }
        diagnostics: { type: object, additionalProperties: true }
        prediction: { type: object, additionalProperties: true }
        latest: { type: object, additionalProperties: true }
        findings:
          type: array
          items: { type: object, additionalProperties: true }

    AgentResponse:
      type: object
      properties:
        result: { type: object, additionalProperties: true }
        text: { type: string }
        ai:
          type: object
          properties:
            backend: { type: string, enum: [claude, stub] }
            model: { type: string, example: claude-sonnet-5 }
            input_tokens: { type: integer }
            output_tokens: { type: integer }
            cache_read_tokens: { type: integer }
            cost_usd: { type: number }
            thinking: { type: string, enum: [off, adaptive] }

    ThreedJob:
      type: object
      properties:
        job_id: { type: string }
        status: { type: string, enum: [queued, running, completed, failed] }
        stage: { type: string }
        filename: { type: string }
        stages: { type: object, additionalProperties: true }
        error: { type: string, nullable: true }
        created: { type: number }
        updated: { type: number }

    ValidationReport:
      type: object
      properties:
        conforms: { type: boolean }
        violations:
          type: array
          items:
            type: object
            properties:
              shape: { type: string }
              focus_node: { type: string }
              path: { type: string }
              message: { type: string }
              severity: { type: string }
