openapi: 3.0.3
info:
  title: NextXR Digital Twin Platform API
  description: |
    Ontology-driven industrial digital-twin API. Covers twin lifecycle, the
    semantic graph and its governance, the machine-twin physics runtime,
    telemetry ingestion and history, field-protocol connectors, solar PV
    analytics, the embedded AI copilot, agentic twin authoring, 3-D
    reconstruction, the live event bus and platform health.

    136 endpoints across 12 routers plus a mounted 3-D sub-application.

    ## Authentication

    Two credential types, deliberately not interchangeable.

    - **`X-API-Key`** — a human/service credential carrying a **role**
      (`admin`, `write`, `read`) and a **tenant scope**. Configured as a JSON
      array in `NXR_API_KEYS`; the built-in demo keys load **only** when that
      variable is unset (i.e. never in a correctly-configured deployment).
      Set `NXR_REQUIRE_AUTH=1` to reject keyless calls even before keys load.
    - **`X-Device-Token`** — a telemetry device credential granting exactly one
      verb (append telemetry) in exactly one tenant, optionally narrowed to an
      asset prefix. Returned once at registration; only the hash is stored.
      It is never accepted on a read, control or copilot route, and an API key
      is never accepted on the ingest routes in its place.

    > While `NXR_API_KEYS` is unset the API is **OPEN** — every `/api` call,
    > including the LLM-billing `/copilot` endpoints, is served without a key.

    ## Multi-tenancy

    Every request is scoped to a tenant. Tenant authorisation is a single
    application-level dependency (`server/tenancy.py`) that runs **after**
    routing, so it checks the tenant wherever it appears — query string, path
    parameter **and** request body — on every `/api` route. A key scoped to one
    tenant receives `403` for another.

    Four key scope forms, evaluated most specific first:

    | Form | Meaning |
    |---|---|
    | `{"tenant": "acme"}` | exactly one tenant |
    | `{"tenant_prefix": "acme-"}` | every tenant under a prefix (the only form that may create twins) |
    | `{"tenants": ["acme","acme-2"]}` | an explicit set |
    | `{"tenant": "*"}` | admin — all tenants |

    ## Streaming

    `GET /api/v1/bus/stream` returns a Server-Sent Events stream of the caller's
    tenant events. Long-lived; behind an ALB set the idle timeout to at least
    300 seconds.

    ## Degradation

    `GET /api/v1/health` **always** returns 200 and reports component status in
    the payload, so a client can distinguish "server up, database down"
    (`degraded`) from "server unreachable". Neo4j being unreachable converts to a
    `503` with operator guidance on any route that needs it.
  version: 1.0.0
  contact:
    name: GoalCert Engineering
    email: engineering@goalcert.com
  license:
    name: Commercial in Confidence

servers:
  - url: https://twin.goalcert.com
    description: Production
  - url: https://twin-staging.goalcert.com
    description: Staging
  - url: http://localhost:8080
    description: Local development

tags:
  - name: graph
    description: Read the ontology graph — entities, findings, change log, topology, bus, health
  - name: write
    description: Mutate the ontology graph through the validate-commit-changelog-bus path
  - name: schema
    description: Ontology introspection, SHACL validation and taxonomy governance
  - name: twins
    description: Twin registry — templates, create, read, delete
  - name: twin-runtime
    description: Machine-twin physics runtime — state, diagnostics, prediction, control
  - name: ingest
    description: Inbound telemetry and the device credentials that push it
  - name: historian
    description: Measurement history, trends and coverage (TimescaleDB)
  - name: connectors
    description: Field-protocol connectors (Modbus, OPC-UA, MQTT) and point-map profiles
  - name: solar
    description: Enterprise solar PV analytics — De Soto model, residuals, diagnosis, AR, training
  - name: copilot
    description: Embedded Claude agents — narration, diagnosis, work orders, procedures, chat
  - name: agents
    description: Agentic build — twin builder, bundle author, operational, plugin, accelerator graphs
  - name: hub
    description: GoalCert Hub integration surface
  - name: feed
    description: Deterministic simulated feed control
  - name: threed
    description: 3-D reconstruction platform (photo to GLB), mounted sub-application

security:
  - ApiKeyAuth: []

paths:

  # ==========================================================================
  # graph
  # ==========================================================================
  /api/v1/entities:
    get:
      tags: [graph]
      summary: List entities for a tenant
      operationId: listEntities
      parameters:
        - $ref: '#/components/parameters/TenantQuery'
        - name: label
          in: query
          schema: { type: string }
          description: Restrict to one taxonomy category (e.g. PhysicalAsset)
        - name: limit
          in: query
          schema: { type: integer, default: 100, maximum: 1000 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Entities in the caller's tenant scope
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Entity' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/GraphUnavailable' }
    post:
      tags: [write]
      summary: Create an entity (SHACL-validated before commit)
      operationId: createEntity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntityCreate' }
      responses:
        '201':
          description: Created; a change-log event and a bus event were emitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entity' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/GraphUnavailable' }

  /api/v1/entities/{node_id}:
    parameters:
      - $ref: '#/components/parameters/NodeId'
    get:
      tags: [graph]
      summary: Get one entity with its properties
      operationId: getEntity
      parameters: [ { $ref: '#/components/parameters/TenantQuery' } ]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entity' }
          description: The entity
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [write]
      summary: Update entity properties
      operationId: updateEntity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant, properties]
              properties:
                tenant: { type: string }
                properties: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Updated; the change-log diff records old and new per field
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entity' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [write]
      summary: Delete an entity
      operationId: deleteEntity
      parameters: [ { $ref: '#/components/parameters/TenantQuery' } ]
      responses:
        '200':
          description: Deleted; a delete event extends the tenant's chain
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ack' }

  /api/v1/entities/{node_id}/rel:
    post:
      tags: [write]
      summary: Relate two entities with an ontology object property
      operationId: relateEntity
      parameters: [ { $ref: '#/components/parameters/NodeId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant, predicate, target_id]
              properties:
                tenant: { type: string }
                predicate:
                  type: string
                  description: CURIE resolved from the registered prefix table
                  example: hvac:servesSpace
                target_id: { type: string }
      responses:
        '201':
          description: Relationship created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ack' }
        '400':
          description: Unregistered CURIE prefix
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/entities/{node_id}/telemetry:
    get:
      tags: [graph]
      summary: Live signal values for an entity
      operationId: entityTelemetry
      parameters:
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/TenantQuery'
      responses:
        '200':
          description: Current signal values written onto the node by the runtime
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/v1/findings:
    get:
      tags: [graph]
      summary: List findings emitted by the behaviour registry
      operationId: listFindings
      parameters:
        - $ref: '#/components/parameters/TenantQuery'
        - name: severity
          in: query
          schema: { type: string, enum: [info, warning, critical] }
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
      responses:
        '200':
          description: Findings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Finding' }

  /api/v1/changelog:
    get:
      tags: [graph]
      summary: The tenant's tamper-evident change-log chain
      operationId: tenantChangelog
      parameters:
        - $ref: '#/components/parameters/TenantQuery'
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
      responses:
        '200':
          description: Events in chain order; prev_event_hash links each to the previous
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChangeEvent' }

  /api/v1/changelog/{entity_id}:
    get:
      tags: [graph]
      summary: Change history for one entity
      operationId: entityChangelog
      parameters:
        - name: entity_id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/TenantQuery'
      responses:
        '200':
          description: Events concerning this entity
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChangeEvent' }

  /api/v1/topology:
    get:
      tags: [graph]
      summary: Nodes and edges for the 3-D and network views
      operationId: topology
      parameters: [ { $ref: '#/components/parameters/TenantQuery' } ]
      responses:
        '200':
          description: Graph topology
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes: { type: array, items: { $ref: '#/components/schemas/Entity' } }
                  edges:
                    type: array
                    items:
                      type: object
                      properties:
                        source: { type: string }
                        predicate: { type: string }
                        target: { type: string }

  /api/v1/stats:
    get:
      tags: [graph]
      summary: Graph and platform counters
      operationId: stats
      parameters:
        - name: tenant
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Entity, finding and event counts, active twins, ontology version
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/v1/bus/stats:
    get:
      tags: [graph]
      summary: Event-bus backend and throughput
      operationId: busStats
      responses:
        '200':
          description: |
            Reports `backend` (redis / memory / null), `required` and
            `scale_safe`. An in-memory bus reports healthy because as a process
            it IS working — and is nonetheless wrong at two tasks, where each
            would see only its own events.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusInfo' }

  /api/v1/bus/events:
    get:
      tags: [graph]
      summary: Recent event buffer (for late joiners)
      operationId: busEvents
      parameters:
        - $ref: '#/components/parameters/TenantQuery'
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        '200':
          description: Buffered events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BusEvent' }

  /api/v1/bus/stream:
    get:
      tags: [graph]
      summary: Server-Sent Events stream for a tenant
      operationId: busStream
      parameters: [ { $ref: '#/components/parameters/TenantQuery' } ]
      responses:
        '200':
          description: |
            `text/event-stream`. One Redis stream per tenant
            (`nxr:events:<tenant_id>`), so a consumer reading one tenant's
            stream cannot see another's.
          content:
            text/event-stream:
              schema: { type: string }

  /api/v1/health:
    get:
      tags: [graph]
      summary: Component health — always HTTP 200
      operationId: health
      security: []
      responses:
        '200':
          description: |
            `status` is `healthy` or `degraded`. Returning 503 here made the
            whole UI look dead whenever Neo4j was down, even though the app
            shell, twins registry, schema and event bus all work — so the status
            lives in the payload and the ALB target-group check cannot see a
            database outage on its own. Add a CloudWatch alarm on `degraded`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  # ==========================================================================
  # schema
  # ==========================================================================
  /api/v1/schema/version:
    get:
      tags: [schema]
      summary: Loaded ontology version and parsed files
      operationId: schemaVersion
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }

  /api/v1/schema/types:
    get:
      tags: [schema]
      summary: All entity classes
      operationId: schemaTypes
      responses:
        '200': { $ref: '#/components/responses/JsonArray' }

  /api/v1/schema/categories:
    get:
      tags: [schema]
      summary: The ten closed taxonomy categories
      description: |
        Fixed at platform version v3. Every entity class declares exactly one via
        `nxr:taxonomyCategory` and may never introduce an eleventh.
      operationId: schemaCategories
      responses:
        '200': { $ref: '#/components/responses/JsonArray' }

  /api/v1/schema/predicates:
    get:
      tags: [schema]
      summary: Object-property (relationship) vocabulary
      operationId: schemaPredicates
      responses:
        '200': { $ref: '#/components/responses/JsonArray' }

  /api/v1/schema/class/{name}:
    get:
      tags: [schema]
      summary: Class definition and metadata
      operationId: schemaClass
      parameters: [ { $ref: '#/components/parameters/ClassName' } ]
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/schema/class/{name}/properties:
    get:
      tags: [schema]
      summary: Observable and object properties of a class
      operationId: schemaClassProperties
      parameters: [ { $ref: '#/components/parameters/ClassName' } ]
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }

  /api/v1/schema/class/{name}/behavior:
    get:
      tags: [schema]
      summary: Behaviours bound to a class
      operationId: schemaClassBehavior
      parameters: [ { $ref: '#/components/parameters/ClassName' } ]
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }

  /api/v1/schema/archetypes:
    get:
      tags: [schema]
      summary: Physics archetypes an asset can be assigned
      operationId: schemaArchetypes
      responses:
        '200': { $ref: '#/components/responses/JsonArray' }

  /api/v1/schema/asset-types:
    get:
      tags: [schema]
      summary: Instantiable asset types with their required properties
      operationId: schemaAssetTypes
      responses:
        '200': { $ref: '#/components/responses/JsonArray' }

  /api/v1/schema/validate:
    post:
      tags: [schema]
      summary: SHACL-validate a payload without writing it
      operationId: schemaValidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [canonical_type, properties]
              properties:
                canonical_type: { type: string }
                properties: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Conformance report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationReport' }

  /api/v1/schema/governance:
    get:
      tags: [schema]
      summary: Taxonomy-closure validation over the ontology itself
      description: |
        Applies `nxr:TaxonomyClosureShape` to the T-Box. A class declaring an
        eleventh category — or none at all without `nxr:isStructural` — is a
        violation. Deliberately not part of the write-path shape bundle: it
        validates the ontology as data, not tenant mutations.
      operationId: schemaGovernance
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationReport' }
          description: Governance report

  # ==========================================================================
  # twins
  # ==========================================================================
  /api/v1/twins/templates:
    get:
      tags: [twins]
      summary: Available seeding templates
      operationId: listTemplates
      responses:
        '200': { $ref: '#/components/responses/JsonArray' }

  /api/v1/twins:
    get:
      tags: [twins]
      summary: List twins in the caller's scope
      operationId: listTwins
      responses:
        '200':
          description: Twin registry records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Twin' }
    post:
      tags: [twins]
      summary: Create and seed a twin
      description: |
        Entities are seeded through the Graph Writer, so validation, change log
        and bus events all fire. Only a prefix-scoped or admin key may create a
        twin — the new twin's id has to land inside the creator's own scope to
        remain readable.
      operationId: createTwin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, name, domain]
              properties:
                tenant_id: { type: string }
                name: { type: string }
                domain:
                  type: string
                  description: Seeding template or machine-twin domain key
                  example: solar-pv-array
                description: { type: string }
      responses:
        '201':
          description: Created and seeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Twin' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/twins/{tenant}:
    parameters: [ { $ref: '#/components/parameters/TenantPath' } ]
    get:
      tags: [twins]
      summary: Twin registry record
      operationId: getTwin
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Twin' }
          description: The twin
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [twins]
      summary: Delete a twin and its entities
      description: The change log is retained as an audit record of what existed.
      operationId: deleteTwin
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ack' }
          description: Deleted

  # ==========================================================================
  # twin-runtime
  # ==========================================================================
  /api/v1/twins/domains:
    get:
      tags: [twin-runtime]
      summary: Machine-twin domains discovered from their SPECs
      description: |
        Eleven ship in the box: turbine-engine, edm-machine, railway-metro,
        railway-trainset, tram-network, hospital-campus, ev-charging-network,
        ev-battery-pack, defence-base, defence-warship, solar-pv-array.
        A missing or broken pack is skipped rather than failing the request.
      operationId: listMachineDomains
      responses:
        '200':
          description: SPEC summaries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DomainSpec' }

  /api/v1/twins/{tenant}/state:
    get:
      tags: [twin-runtime]
      summary: Live frame — signals, control, running flag, health, faults
      operationId: twinState
      parameters: [ { $ref: '#/components/parameters/TenantPath' } ]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TwinState' }
          description: The authoritative state published by the lease owner

  /api/v1/twins/{tenant}/diagnostics:
    get:
      tags: [twin-runtime]
      summary: Per-sensor status and per-subsystem health
      operationId: twinDiagnostics
      parameters: [ { $ref: '#/components/parameters/TenantPath' } ]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Diagnostics' }
          description: Evaluated from the pack's checks table and component_health

  /api/v1/twins/{tenant}/predict:
    get:
      tags: [twin-runtime]
      summary: Remaining useful life and degradation forecast
      operationId: twinPredict
      parameters: [ { $ref: '#/components/parameters/TenantPath' } ]
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }

  /api/v1/twins/{tenant}/project:
    post:
      tags: [twin-runtime]
      summary: What-if projection (does not mutate the live twin)
      operationId: twinProject
      parameters: [ { $ref: '#/components/parameters/TenantPath' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                control: { type: number }
                horizon_hours: { type: number }
                fault: { type: string }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }

  /api/v1/twins/{tenant}/network:
    get:
      tags: [twin-runtime]
      summary: Network state for network-shaped domains
      description: Metro, tram, EV charging and defence-base twins. Others return 404.
      operationId: twinNetwork
      parameters: [ { $ref: '#/components/parameters/TenantPath' } ]
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/twins/{tenant}/running:
    post:
      tags: [twin-runtime]
      summary: Start or stop the simulation
      description: A follower task forwards the command to the lease owner rather than acting locally.
      operationId: twinRunning
      parameters: [ { $ref: '#/components/parameters/TenantPath' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [running]
              properties:
                running: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }

  /api/v1/twins/{tenant}/simulate:
    post:
      tags: [twin-runtime]
      summary: Inject a fault or set the control input
      description: |
        The fault persists in the stateful integrator until cleared — wear
        accumulates and heat soaks, so this is a simulation, not a value override.
      operationId: twinSimulate
      parameters: [ { $ref: '#/components/parameters/TenantPath' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fault:
                  type: string
                  description: A key from the pack's FAULTS table
                control:
                  type: number
                  description: The pack's declared control input (throttle, curtailment, ...)
                clear: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }

  # ==========================================================================
  # ingest
  # ==========================================================================
  /api/v1/ingest/telemetry:
    post:
      tags: [ingest]
      summary: Append one telemetry sample
      operationId: ingestTelemetry
      security:
        - DeviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TelemetrySample' }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/ingest/telemetry/bulk:
    post:
      tags: [ingest]
      summary: Append a batch of telemetry samples
      description: |
        Idempotent. The historian's `(tenant_id, asset_id, signal, ts)` primary
        key means a replayed batch collides and is skipped, so an edge agent that
        reconnects after a network blip and resends its buffer cannot
        double-count.
      operationId: ingestBulk
      security:
        - DeviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [samples]
              properties:
                samples:
                  type: array
                  items: { $ref: '#/components/schemas/TelemetrySample' }
      responses:
        '202':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestResult' }
          description: Accepted, with per-batch accepted/duplicate/rejected counts

  /api/v1/ingest/status:
    get:
      tags: [ingest]
      summary: Ingest counters and behaviour-evaluation mode
      operationId: ingestStatus
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }

  /api/v1/ingest/devices:
    get:
      tags: [ingest]
      summary: List devices (never returns the token)
      operationId: listDevices
      parameters: [ { $ref: '#/components/parameters/TenantQuery' } ]
      responses:
        '200':
          description: Devices with liveness counters
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Device' }
    post:
      tags: [ingest]
      summary: Register a device — the token is returned exactly once
      operationId: createDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant, name]
              properties:
                tenant: { type: string }
                name: { type: string }
                asset_prefix: { type: string }
                expires_at: { type: string, format: date-time }
      responses:
        '201':
          description: |
            `token` is present in this response and **never again** — only its
            hash is stored.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Device'
                  - type: object
                    properties:
                      token: { type: string }

  /api/v1/ingest/devices/{device_id}/rotate:
    post:
      tags: [ingest]
      summary: Issue a new token and invalidate the old one
      operationId: rotateDevice
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      responses:
        '200':
          description: New token (returned once)
          content:
            application/json:
              schema:
                type: object
                properties:
                  device_id: { type: string }
                  token: { type: string }

  /api/v1/ingest/devices/{device_id}/enabled:
    post:
      tags: [ingest]
      summary: Enable or disable a device without deleting it
      operationId: setDeviceEnabled
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }

  /api/v1/ingest/devices/{device_id}:
    delete:
      tags: [ingest]
      summary: Revoke a device credential
      description: Revocable on its own, without rotating anything a human uses.
      operationId: deleteDevice
      parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ack' }
          description: Revoked

  # ==========================================================================
  # historian
  # ==========================================================================
  /api/v1/entities/{node_id}/history:
    get:
      tags: [historian]
      summary: Measurement history for an entity over a time range
      description: |
        Serves the smallest sufficient source (raw, then 1m, 1h, 1d). Means are
        computed from `count` and `sum_value` rather than stored as `avg`,
        because an average cannot be re-averaged.
      operationId: entityHistory
      parameters:
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/TenantQuery'
        - name: signal
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: resolution
          in: query
          schema: { type: string, enum: [raw, 1m, 1h, 1d] }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HistoryPoint' }
          description: Time series

  /api/v1/entities/{node_id}/latest:
    get:
      tags: [historian]
      summary: Latest value per signal for an entity
      operationId: entityLatest
      parameters:
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/TenantQuery'
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }

  /api/v1/twins/{tenant}/signals:
    get:
      tags: [historian]
      summary: Signal catalogue with last-seen times
      description: Backs the tag-mapping UI and the staleness check.
      operationId: twinSignals
      parameters: [ { $ref: '#/components/parameters/TenantPath' } ]
      responses:
        '200': { $ref: '#/components/responses/JsonArray' }

  /api/v1/twins/{tenant}/trends:
    get:
      tags: [historian]
      summary: Aligned multi-signal series for charting
      operationId: twinTrends
      parameters:
        - $ref: '#/components/parameters/TenantPath'
        - name: signals
          in: query
          schema: { type: string }
          description: Comma-separated signal names
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: bucket
          in: query
          schema: { type: string, enum: [1m, 1h, 1d] }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }

  /api/v1/twins/{tenant}/history/stats:
    get:
      tags: [historian]
      summary: Coverage, backend and data quality
      operationId: twinHistoryStats
      parameters: [ { $ref: '#/components/parameters/TenantPath' } ]
      responses:
        '200':
          description: |
            Includes `backend` (`timescale` / `postgres` / `sqlite`) and
            `scale_safe` — the field to alarm on. A deployment that declared
            Timescale mandatory and did not get it is not healthy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistorianInfo' }

  # ==========================================================================
  # connectors
  # ==========================================================================
  /api/v1/connectors/protocols:
    get:
      tags: [connectors]
      summary: Supported protocols and driver availability
      description: |
        `modbus_tcp` and `modbus_rtu` (pymodbus), `opcua` (asyncua), `mqtt`
        (paho-mqtt plus protobuf for Sparkplug B). Protocol modules are imported
        lazily, so a missing optional driver disables one protocol rather than
        the service.
      operationId: connectorProtocols
      responses:
        '200': { $ref: '#/components/responses/JsonArray' }

  /api/v1/connectors/profiles:
    get:
      tags: [connectors]
      summary: Built-in point-map profiles
      description: |
        sunspec_inverter_3ph, string_combiner, revenue_meter, ct_clamp_panel,
        weather_station, mqtt_gateway, opcua_inverter.
      operationId: connectorProfiles
      responses:
        '200': { $ref: '#/components/responses/JsonArray' }

  /api/v1/connectors/profiles/{key}/build:
    post:
      tags: [connectors]
      summary: Preview the point map a profile would build
      operationId: buildProfilePreview
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }

  /api/v1/connectors:
    get:
      tags: [connectors]
      summary: List connectors (credentials redacted)
      operationId: listConnectors
      parameters:
        - name: tenant
          in: query
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Connector' }
          description: Connectors
    post:
      tags: [connectors]
      summary: Create a connector
      operationId: createConnector
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectorCreate' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connector' }
          description: Created

  /api/v1/connectors/{connector_id}:
    parameters: [ { $ref: '#/components/parameters/ConnectorId' } ]
    get:
      tags: [connectors]
      summary: Get one connector
      operationId: getConnector
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connector' }
          description: The connector, with credentials redacted by allow-list
    patch:
      tags: [connectors]
      summary: Update connector configuration
      operationId: updateConnector
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connector' }
          description: Updated
    delete:
      tags: [connectors]
      summary: Delete a connector
      operationId: deleteConnector
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ack' }
          description: Deleted

  /api/v1/connectors/{connector_id}/start:
    post:
      tags: [connectors]
      summary: Start the connector worker
      description: Exactly one task owns a connector, via a Redis lease.
      operationId: startConnector
      parameters: [ { $ref: '#/components/parameters/ConnectorId' } ]
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }

  /api/v1/connectors/{connector_id}/stop:
    post:
      tags: [connectors]
      summary: Stop the connector worker
      operationId: stopConnector
      parameters: [ { $ref: '#/components/parameters/ConnectorId' } ]
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }

  /api/v1/connectors/{connector_id}/health:
    get:
      tags: [connectors]
      summary: Connection state, last poll, sample and error counters
      operationId: connectorHealth
      parameters: [ { $ref: '#/components/parameters/ConnectorId' } ]
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }

  /api/v1/connectors/{connector_id}/test:
    post:
      tags: [connectors]
      summary: One-shot read against the device
      operationId: testConnector
      parameters: [ { $ref: '#/components/parameters/ConnectorId' } ]
      responses:
        '200':
          description: Decoded values, or the protocol error
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/v1/connectors/discover/sunspec:
    post:
      tags: [connectors]
      summary: Walk the SunSpec model chain on a Modbus endpoint
      operationId: discoverSunspec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                host: { type: string }
                port: { type: integer, default: 502 }
                unit_id: { type: integer, default: 1 }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }

  /api/v1/connectors/{connector_id}/browse:
    post:
      tags: [connectors]
      summary: Browse an OPC-UA address space
      description: Map points without vendor documentation.
      operationId: browseConnector
      parameters: [ { $ref: '#/components/parameters/ConnectorId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                start_node: { type: string }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }

  # ==========================================================================
  # solar  (Enterprise Solar Digital Twin specification)
  # ==========================================================================
  /api/v1/solar/model/evaluate:
    post:
      tags: [solar]
      summary: "De Soto five-parameter single-diode evaluation (§4.1)"
      description: |
        A PV array's raw output carries almost no information about its
        condition — 400 kW from a 500 kW array is excellent at 8 a.m. and
        alarming at noon. This model supplies the missing half: what this array,
        at this irradiance and this cell temperature, SHOULD be producing.
      operationId: solarModelEvaluate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                irradiance: { type: number, description: "Plane-of-array irradiance, W/m²" }
                cell_temp: { type: number, description: "Cell temperature, °C" }
                module: { type: object, additionalProperties: true }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }

  /api/v1/solar/triggers:
    get:
      tags: [solar]
      summary: "Maintenance trigger catalogue (§4.2)"
      description: |
        Machine-readable, so the work-order and procurement agents can act on a
        finding without re-deriving what it means. Each entry names a signature,
        its behaviour id, the condition, the diagnosis, the action and a priority.
      operationId: solarTriggerCatalogue
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MaintenanceTrigger' }
          description: The three signatures

  /api/v1/solar/{tenant}/model/iv-curve:
    get:
      tags: [solar]
      summary: Modelled I-V curve at the current operating point
      operationId: solarIvCurve
      parameters: [ { $ref: '#/components/parameters/TenantPath' } ]
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }

  /api/v1/solar/{tenant}/residual:
    get:
      tags: [solar]
      summary: "ΔP vs model, performance ratio, fill factor, R_sh, imbalance"
      operationId: solarResidual
      parameters: [ { $ref: '#/components/parameters/TenantPath' } ]
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }

  /api/v1/solar/{tenant}/diagnosis:
    get:
      tags: [solar]
      summary: "Classify the residual signature and name the physical cause"
      operationId: solarDiagnosis
      parameters: [ { $ref: '#/components/parameters/TenantPath' } ]
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }

  /api/v1/solar/{tenant}/triggers:
    get:
      tags: [solar]
      summary: Active maintenance triggers for this array
      operationId: solarTwinTriggers
      parameters: [ { $ref: '#/components/parameters/TenantPath' } ]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MaintenanceTrigger' }
          description: Triggers currently firing

  /api/v1/solar/{tenant}/heatmap:
    get:
      tags: [solar]
      summary: "Per-zone performance overlay for the 3-D scene (§5.1)"
      operationId: solarHeatmap
      parameters: [ { $ref: '#/components/parameters/TenantPath' } ]
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }

  /api/v1/solar/{tenant}/strings:
    get:
      tags: [solar]
      summary: Per-string voltage, current, imbalance and status
      operationId: solarStrings
      parameters: [ { $ref: '#/components/parameters/TenantPath' } ]
      responses:
        '200': { $ref: '#/components/responses/JsonArray' }

  /api/v1/solar/{tenant}/energy:
    get:
      tags: [solar]
      summary: Generated, exported and curtailed energy
      operationId: solarEnergy
      parameters: [ { $ref: '#/components/parameters/TenantPath' } ]
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }

  /api/v1/solar/{tenant}/measured/summary:
    get:
      tags: [solar]
      summary: "Measured-signal summary (§2.2 weather + electrical)"
      operationId: solarMeasuredSummary
      parameters: [ { $ref: '#/components/parameters/TenantPath' } ]
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }

  /api/v1/solar/{tenant}/forecast:
    get:
      tags: [solar]
      summary: Degradation forecast
      operationId: solarForecast
      parameters: [ { $ref: '#/components/parameters/TenantPath' } ]
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }

  /api/v1/solar/{tenant}/field-service/{asset_id}:
    get:
      tags: [solar]
      summary: "Immersive field-service payload (§5.2 mobile AR / smart glasses)"
      operationId: solarFieldService
      parameters:
        - $ref: '#/components/parameters/TenantPath'
        - name: asset_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }

  /api/v1/solar/{tenant}/training/scenario:
    post:
      tags: [solar]
      summary: "Inject a training scenario (§5.3 multiplayer training lab)"
      operationId: solarTrainingScenario
      parameters: [ { $ref: '#/components/parameters/TenantPath' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                scenario: { type: string }
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }

  /api/v1/solar/{tenant}/training/reset:
    post:
      tags: [solar]
      summary: Restore the pre-scenario state
      operationId: solarTrainingReset
      parameters: [ { $ref: '#/components/parameters/TenantPath' } ]
      responses:
        '200': { $ref: '#/components/responses/JsonObject' }

