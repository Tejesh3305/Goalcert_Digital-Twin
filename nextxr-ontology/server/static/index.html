<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NextXR Digital Twin</title>
<style>
@font-face {
  font-family: 'Inst';
  src: local('DM Sans'), local('Helvetica Neue'), local('Helvetica');
  font-weight: 400 700;
}

:root {
  --paper: #f4f1ec;
  --paper-warm: #eae6df;
  --ink: #1a1714;
  --ink-50: #8a857e;
  --ink-30: #b8b3ac;
  --ink-15: #d9d5cf;
  --ink-08: #e8e5e0;
  --red: #c23616;
  --red-bg: #fdf0ed;
  --amber: #b45309;
  --amber-bg: #fef7ed;
  --green: #1b7a3d;
  --green-bg: #edf7f0;
  --blue: #1d4ed8;
  --blue-bg: #eff2fb;
  --chart-line: #1a1714;
  --chart-fill: rgba(26,23,20,0.06);
  --slide-width: 420px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { font-size: 15px; }

body {
  font-family: 'Inst', 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--paper);
  color: var(--ink);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ── TOPBAR ─────────────────────────────────── */
.topbar {
  position: sticky; top: 0; z-index: 50;
  background: var(--ink);
  color: var(--paper);
  height: 48px;
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 24px;
}

.topbar-brand {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  flex-shrink: 0;
}

.topbar-brand em {
  font-style: normal;
  color: var(--ink-30);
  font-weight: 400;
  margin-left: 2px;
}

.topbar-sep {
  width: 1px;
  height: 20px;
  background: rgba(255,255,255,0.15);
  flex-shrink: 0;
}

.topbar-status {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.5);
}

.topbar-status .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--green);
  flex-shrink: 0;
}

.topbar-status .dot.off { background: var(--red); }

.topbar-feed {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
}

.topbar-feed span {
  font-size: 11px;
  color: rgba(255,255,255,0.45);
  letter-spacing: 0.3px;
}

.topbar-feed strong {
  color: rgba(255,255,255,0.85);
  font-weight: 600;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 12px;
  font-family: inherit;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  border: none;
  cursor: pointer;
  transition: opacity 0.15s;
}

.btn:hover { opacity: 0.8; }
.btn:disabled { opacity: 0.3; cursor: default; }

.btn-start {
  background: var(--green);
  color: #fff;
}

.btn-stop {
  background: transparent;
  color: rgba(255,255,255,0.5);
  border: 1px solid rgba(255,255,255,0.2);
}

.btn-stop:hover { color: #fff; border-color: rgba(255,255,255,0.5); }

/* ── METRICS STRIP ──────────────────────────── */
.metrics {
  display: flex;
  border-bottom: 1px solid var(--ink-15);
  background: var(--paper-warm);
}

.metric {
  flex: 1;
  padding: 16px 20px;
  border-right: 1px solid var(--ink-15);
  min-width: 0;
}

.metric:last-child { border-right: none; }

.metric-val {
  font-size: 28px;
  font-weight: 700;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.metric-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--ink-50);
  margin-top: 4px;
}

.metric.alert .metric-val { color: var(--red); }
.metric.warn .metric-val { color: var(--amber); }

/* ── MAIN LAYOUT ────────────────────────────── */
.main {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: auto auto;
  min-height: calc(100vh - 48px - 80px);
}

@media (max-width: 960px) {
  .main { grid-template-columns: 1fr; }
}

/* ── CHART SECTION ──────────────────────────── */
.chart-section {
  grid-column: 1 / -1;
  border-bottom: 1px solid var(--ink-15);
  padding: 20px 24px 16px;
  position: relative;
}

.chart-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 12px;
}

.section-title {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--ink-50);
  font-weight: 600;
}

.chart-live-val {
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}

.chart-live-val strong {
  font-size: 20px;
  font-weight: 700;
}

.chart-canvas-wrap {
  height: 160px;
  position: relative;
}

.chart-canvas-wrap canvas {
  width: 100%;
  height: 100%;
  display: block;
}

/* ── PANEL SHARED ───────────────────────────── */
.panel {
  border-right: 1px solid var(--ink-15);
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.panel:last-child { border-right: none; }

.panel-head {
  padding: 16px 20px 12px;
  border-bottom: 1px solid var(--ink-08);
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}

.panel-count {
  font-size: 11px;
  color: var(--ink-30);
  font-variant-numeric: tabular-nums;
}

.panel-scroll {
  flex: 1;
  overflow-y: auto;
  min-height: 200px;
  max-height: 50vh;
}

.panel-scroll::-webkit-scrollbar { width: 3px; }
.panel-scroll::-webkit-scrollbar-thumb { background: var(--ink-15); }

/* ── ENTITY LIST ────────────────────────────── */
.entity-item {
  display: flex;
  align-items: center;
  padding: 10px 20px;
  border-bottom: 1px solid var(--ink-08);
  cursor: pointer;
  transition: background 0.1s;
  gap: 12px;
}

.entity-item:hover { background: var(--paper-warm); }

.entity-type {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--ink-50);
  background: var(--ink-08);
  padding: 2px 8px;
  flex-shrink: 0;
  font-weight: 600;
  min-width: 75px;
  text-align: center;
}

.entity-type.finding { background: var(--amber-bg); color: var(--amber); }
.entity-type.location { background: var(--blue-bg); color: var(--blue); }

.entity-name {
  flex: 1;
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.entity-status {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--green);
  font-weight: 600;
}

.entity-id {
  font-size: 10px;
  color: var(--ink-30);
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
}

/* ── FINDINGS ───────────────────────────────── */
.finding-item {
  padding: 12px 20px 12px 16px;
  border-bottom: 1px solid var(--ink-08);
  border-left: 3px solid transparent;
  cursor: pointer;
  transition: background 0.1s;
}

.finding-item:hover { background: var(--paper-warm); }
.finding-item.sev-critical { border-left-color: var(--red); }
.finding-item.sev-warning { border-left-color: var(--amber); }
.finding-item.sev-info { border-left-color: var(--blue); }

.finding-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 3px;
}

.finding-tier {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: 700;
}

.finding-tier.critical { color: var(--red); }
.finding-tier.warning { color: var(--amber); }

.finding-time {
  font-size: 10px;
  color: var(--ink-30);
  font-variant-numeric: tabular-nums;
}

.finding-msg {
  font-size: 12px;
  line-height: 1.4;
  color: var(--ink);
}

.finding-meta {
  font-size: 10px;
  color: var(--ink-50);
  margin-top: 4px;
}

/* ── CHANGELOG ──────────────────────────────── */
.log-section {
  grid-column: 1 / -1;
  border-top: 1px solid var(--ink-15);
}

.log-section .panel-scroll {
  max-height: 240px;
}

.log-item {
  display: flex;
  align-items: center;
  padding: 6px 20px;
  border-bottom: 1px solid var(--ink-08);
  font-size: 12px;
  gap: 12px;
  font-variant-numeric: tabular-nums;
}

.log-action {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: 700;
  min-width: 48px;
}

.log-action.create { color: var(--green); }
.log-action.update { color: var(--blue); }
.log-action.delete { color: var(--red); }

.log-actor {
  color: var(--ink-50);
  min-width: 140px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 11px;
}

.log-entity {
  flex: 1;
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-size: 10px;
  color: var(--ink-30);
}

.log-time {
  color: var(--ink-30);
  font-size: 10px;
  flex-shrink: 0;
}

.empty-state {
  padding: 32px 20px;
  text-align: center;
  color: var(--ink-30);
  font-size: 12px;
  letter-spacing: 0.5px;
}

/* ── GRAPH VIS ──────────────────────────────── */
.graph-section {
  grid-column: 1 / -1;
  border-top: 1px solid var(--ink-15);
  border-bottom: 1px solid var(--ink-15);
}

.graph-canvas-wrap {
  height: 320px;
  position: relative;
  background: #faf8f5;
  cursor: grab;
}

.graph-canvas-wrap:active { cursor: grabbing; }

.graph-canvas-wrap canvas {
  width: 100%; height: 100%; display: block;
}

/* ── SLIDE-OUT DETAIL ───────────────────────── */
.slideout {
  position: fixed;
  top: 0; right: 0;
  width: var(--slide-width);
  height: 100vh;
  background: #fff;
  box-shadow: -8px 0 32px rgba(0,0,0,0.08);
  z-index: 100;
  transform: translateX(100%);
  transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.slideout.open { transform: translateX(0); }

.slideout-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.15);
  z-index: 99;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}

.slideout-backdrop.open { opacity: 1; pointer-events: auto; }

.slideout-head {
  padding: 20px;
  border-bottom: 1px solid var(--ink-08);
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-shrink: 0;
}

.slideout-head h2 {
  font-size: 16px;
  font-weight: 700;
  line-height: 1.3;
}

.slideout-head .sub {
  font-size: 11px;
  color: var(--ink-50);
  margin-top: 2px;
}

.slideout-close {
  background: none;
  border: none;
  font-size: 20px;
  color: var(--ink-30);
  cursor: pointer;
  padding: 0;
  line-height: 1;
}

.slideout-close:hover { color: var(--ink); }

.slideout-body {
  flex: 1;
  overflow-y: auto;
  padding: 0;
}

.slideout-section {
  padding: 16px 20px;
  border-bottom: 1px solid var(--ink-08);
}

.slideout-section-title {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--ink-30);
  font-weight: 600;
  margin-bottom: 10px;
}

.prop-row {
  display: flex;
  padding: 5px 0;
  font-size: 12px;
  gap: 12px;
}

.prop-key {
  color: var(--ink-50);
  min-width: 110px;
  flex-shrink: 0;
  font-weight: 500;
}

.prop-val {
  word-break: break-all;
  font-variant-numeric: tabular-nums;
}

.rel-item {
  display: flex;
  align-items: center;
  padding: 8px 0;
  gap: 8px;
  font-size: 12px;
  border-bottom: 1px solid var(--ink-08);
}

.rel-item:last-child { border-bottom: none; }

.rel-type-tag {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--blue);
  font-weight: 700;
  flex-shrink: 0;
}

.rel-arrow {
  color: var(--ink-15);
  flex-shrink: 0;
}

.rel-target { font-weight: 500; }
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-brand">NextXR<em> Digital Twin</em></div>
  <div class="topbar-sep"></div>
  <div class="topbar-status">
    <span class="dot" id="health-dot"></span>
    <span id="health-label">Connecting</span>
  </div>
  <div class="topbar-sep"></div>
  <div class="topbar-status" id="feed-status-label">
    Feed idle
  </div>
  <div class="topbar-feed">
    <span>Samples <strong id="f-samples">0</strong></span>
    <span>Findings <strong id="f-findings">0</strong></span>
    <button class="btn btn-start" id="btn-start" onclick="startFeed()">Start</button>
    <button class="btn btn-stop" id="btn-stop" onclick="stopFeed()" disabled>Stop</button>
  </div>
</div>

<!-- METRICS STRIP -->
<div class="metrics">
  <div class="metric">
    <div class="metric-val" id="m-entities">--</div>
    <div class="metric-label">Entities</div>
  </div>
  <div class="metric">
    <div class="metric-val" id="m-assets">--</div>
    <div class="metric-label">Physical Assets</div>
  </div>
  <div class="metric">
    <div class="metric-val" id="m-locations">--</div>
    <div class="metric-label">Locations</div>
  </div>
  <div class="metric warn">
    <div class="metric-val" id="m-findings">--</div>
    <div class="metric-label">Findings</div>
  </div>
  <div class="metric alert">
    <div class="metric-val" id="m-critical">--</div>
    <div class="metric-label">Critical</div>
  </div>
  <div class="metric">
    <div class="metric-val" id="m-events">--</div>
    <div class="metric-label">Audit Events</div>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- CHART -->
  <div class="chart-section">
    <div class="chart-header">
      <span class="section-title">Supply Air Temperature</span>
      <div class="chart-live-val" id="chart-val">--</div>
    </div>
    <div class="chart-canvas-wrap">
      <canvas id="chart"></canvas>
    </div>
  </div>

  <!-- LEFT: ENTITIES -->
  <div class="panel" id="entities-panel">
    <div class="panel-head">
      <span class="section-title">Graph Entities</span>
      <span class="panel-count" id="ent-count"></span>
    </div>
    <div class="panel-scroll" id="ent-list">
      <div class="empty-state">Waiting for data</div>
    </div>
  </div>

  <!-- RIGHT: FINDINGS -->
  <div class="panel" id="findings-panel">
    <div class="panel-head">
      <span class="section-title">Findings</span>
      <span class="panel-count" id="fnd-count"></span>
    </div>
    <div class="panel-scroll" id="fnd-list">
      <div class="empty-state">No anomalies detected</div>
    </div>
  </div>

  <!-- GRAPH VISUALIZATION -->
  <div class="graph-section">
    <div class="panel-head">
      <span class="section-title">Graph Topology</span>
      <span class="panel-count" id="graph-count"></span>
    </div>
    <div class="graph-canvas-wrap">
      <canvas id="graph-canvas"></canvas>
    </div>
  </div>

  <!-- FULL-WIDTH: CHANGELOG -->
  <div class="log-section">
    <div class="panel-head">
      <span class="section-title">Audit Log</span>
      <span class="panel-count" id="log-count"></span>
    </div>
    <div class="panel-scroll" id="log-list">
      <div class="empty-state">No events recorded</div>
    </div>
  </div>

</div>

<!-- SLIDE-OUT -->
<div class="slideout-backdrop" id="so-backdrop" onclick="closeDetail()"></div>
<div class="slideout" id="so-panel">
  <div class="slideout-head">
    <div>
      <h2 id="so-title">--</h2>
      <div class="sub" id="so-sub">--</div>
    </div>
    <button class="slideout-close" onclick="closeDetail()">&times;</button>
  </div>
  <div class="slideout-body" id="so-body"></div>
</div>

<script>
const T = "demo-tenant";
const A = "/api/v1";
const hist = [];
const MAX_H = 150;
let prevSampleCount = -1;

// ── Health ────────────────────────────────────────
async function pollHealth() {
  try {
    const r = await fetch(`${A}/health`);
    const ok = r.ok;
    document.getElementById("health-dot").className = "dot" + (ok ? "" : " off");
    document.getElementById("health-label").textContent = ok ? "Neo4j connected" : "Disconnected";
  } catch {
    document.getElementById("health-dot").className = "dot off";
    document.getElementById("health-label").textContent = "Offline";
  }
}

// ── Stats ─────────────────────────────────────────
async function pollStats() {
  try {
    const d = await (await fetch(`${A}/stats?tenant=${T}`)).json();
    document.getElementById("m-entities").textContent = d.total_entities || 0;
    document.getElementById("m-assets").textContent = d.entity_counts?.PhysicalAsset || 0;
    document.getElementById("m-locations").textContent = d.entity_counts?.Location || 0;
    document.getElementById("m-findings").textContent = d.total_findings || 0;
    document.getElementById("m-critical").textContent = d.finding_severity?.critical || 0;
    document.getElementById("m-events").textContent = d.changelog_events || 0;
  } catch {}
}

// ── Feed ──────────────────────────────────────────
async function pollFeed() {
  try {
    const d = await (await fetch(`${A}/feed/status`)).json();
    document.getElementById("f-samples").textContent = d.samples_processed || 0;
    document.getElementById("f-findings").textContent = d.findings_emitted || 0;

    const label = document.getElementById("feed-status-label");
    const btnS = document.getElementById("btn-start");
    const btnX = document.getElementById("btn-stop");

    if (d.running) {
      label.innerHTML = '<span class="dot" style="background:var(--green);width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:6px"></span>Feed running';
      btnS.disabled = true;
      btnX.disabled = false;
    } else {
      label.textContent = "Feed idle";
      btnS.disabled = false;
      btnX.disabled = true;
    }

    if (d.latest_value != null && d.samples_processed !== prevSampleCount) {
      prevSampleCount = d.samples_processed;
      hist.push(d.latest_value);
      if (hist.length > MAX_H) hist.shift();

      const v = d.latest_value.toFixed(1);
      const el = document.getElementById("chart-val");
      el.innerHTML = `<strong>${v}</strong>&thinsp;&#8451;`;
      el.style.color = d.latest_value > 25 ? "var(--red)" : d.latest_value > 23 ? "var(--amber)" : "var(--ink)";
      drawChart();
    }
  } catch {}
}

async function startFeed() {
  document.getElementById("btn-start").disabled = true;
  hist.length = 0;
  await fetch(`${A}/feed/start?tenant=${T}`, { method: "POST" });
}

async function stopFeed() {
  await fetch(`${A}/feed/stop`, { method: "POST" });
}

// ── Chart ─────────────────────────────────────────
function drawChart() {
  const c = document.getElementById("chart");
  const wrap = c.parentElement;
  const dpr = window.devicePixelRatio || 1;
  const W = wrap.clientWidth;
  const H = wrap.clientHeight;
  c.width = W * dpr;
  c.height = H * dpr;
  c.style.width = W + "px";
  c.style.height = H + "px";
  const ctx = c.getContext("2d");
  ctx.scale(dpr, dpr);

  const pad = { t: 8, r: 40, b: 16, l: 0 };
  const cw = W - pad.l - pad.r;
  const ch = H - pad.t - pad.b;

  ctx.clearRect(0, 0, W, H);

  if (hist.length < 2) {
    ctx.fillStyle = "#b8b3ac";
    ctx.font = "11px -apple-system, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("Start the feed to see live telemetry", W / 2, H / 2);
    return;
  }

  const lo = Math.min(...hist, 18);
  const hi = Math.max(...hist, 30);
  const rng = hi - lo || 1;
  const x = i => pad.l + (i / (MAX_H - 1)) * cw;
  const y = v => pad.t + ch - ((v - lo) / rng) * ch;
  const off = MAX_H - hist.length;

  // Grid lines
  ctx.strokeStyle = var_ink_08();
  ctx.lineWidth = 1;
  for (let v = Math.ceil(lo); v <= Math.floor(hi); v += 2) {
    const yy = Math.round(y(v)) + 0.5;
    ctx.beginPath(); ctx.moveTo(pad.l, yy); ctx.lineTo(pad.l + cw, yy); ctx.stroke();
    ctx.fillStyle = "#b8b3ac";
    ctx.font = "9px -apple-system, sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(v + "", pad.l + cw + 6, yy + 3);
  }

  // Reference lines
  drawRef(ctx, y, pad, cw, 22, "#1b7a3d", "SP 22");
  drawRef(ctx, y, pad, cw, 25, "#b45309", "WARN 25");

  // Data line
  ctx.beginPath();
  for (let i = 0; i < hist.length; i++) {
    const px = x(i + off), py = y(hist[i]);
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.strokeStyle = var_ink();
  ctx.lineWidth = 1.5;
  ctx.lineJoin = "round";
  ctx.stroke();

  // Fill
  const last_x = x(hist.length - 1 + off);
  ctx.lineTo(last_x, pad.t + ch);
  ctx.lineTo(x(off), pad.t + ch);
  ctx.closePath();
  ctx.fillStyle = "rgba(26,23,20,0.04)";
  ctx.fill();

  // Current dot
  const lv = hist[hist.length - 1];
  const lx = last_x, ly = y(lv);
  ctx.beginPath();
  ctx.arc(lx, ly, 3, 0, Math.PI * 2);
  ctx.fillStyle = lv > 25 ? "#c23616" : lv > 23 ? "#b45309" : "#1a1714";
  ctx.fill();
}

function drawRef(ctx, yFn, pad, cw, val, color, label) {
  const yy = Math.round(yFn(val)) + 0.5;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.globalAlpha = 0.35;
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 3]);
  ctx.beginPath(); ctx.moveTo(pad.l, yy); ctx.lineTo(pad.l + cw, yy); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

// ── Entities ──────────────────────────────────────
async function pollEntities() {
  try {
    const labels = ["PhysicalAsset", "Location", "Finding", "Incident", "Process"];
    let all = [];
    for (const lb of labels) {
      const d = await (await fetch(`${A}/entities?tenant=${T}&label=${lb}&limit=30`)).json();
      for (const n of d.nodes) all.push({ ...n, _label: lb });
    }

    const el = document.getElementById("ent-list");
    const ct = document.getElementById("ent-count");

    if (!all.length) {
      el.innerHTML = '<div class="empty-state">No entities in graph</div>';
      ct.textContent = "";
      return;
    }

    ct.textContent = all.length;
    el.innerHTML = all.map(n => {
      const typeClass = n._label === "Finding" ? " finding" : n._label === "Location" ? " location" : "";
      const status = n.status ? `<span class="entity-status">${n.status}</span>` : "";
      return `<div class="entity-item" onclick="openDetail('${n.id}')">
        <span class="entity-type${typeClass}">${n._label}</span>
        <span class="entity-name">${n.displayName || "(unnamed)"}</span>
        ${status}
        <span class="entity-id">${(n.id || "").substring(0, 8)}</span>
      </div>`;
    }).join("");
  } catch {}
}

// ── Findings ──────────────────────────────────────
async function pollFindings() {
  try {
    const d = await (await fetch(`${A}/findings?tenant=${T}&limit=20`)).json();
    const el = document.getElementById("fnd-list");
    const ct = document.getElementById("fnd-count");

    if (!d.findings.length) {
      el.innerHTML = '<div class="empty-state">No anomalies detected</div>';
      ct.textContent = "";
      return;
    }

    ct.textContent = d.count;
    el.innerHTML = d.findings.map(f => {
      const sev = f.severity || "info";
      const ts = f.createdAt ? new Date(f.createdAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "";
      const conf = f.confidence != null ? `${(f.confidence * 100).toFixed(0)}% confidence` : "";
      // Strip the [C] or [B] prefix from displayName since we show tier separately
      let msg = f.displayName || f.message || "";
      msg = msg.replace(/^\[[A-Z]\]\s*/, "");
      return `<div class="finding-item sev-${sev}" onclick="openDetail('${f.id}')">
        <div class="finding-top">
          <span class="finding-tier ${sev}">Tier ${f.tier || "?"} &middot; ${sev}</span>
          <span class="finding-time">${ts}</span>
        </div>
        <div class="finding-msg">${msg}</div>
        <div class="finding-meta">${f.behaviorId || ""}${conf ? " &middot; " + conf : ""}</div>
      </div>`;
    }).join("");
  } catch {}
}

// ── Slide-out detail ──────────────────────────────
async function openDetail(nodeId) {
  try {
    const d = await (await fetch(`${A}/entities/${nodeId}?tenant=${T}`)).json();
    const node = d.node;
    const rels = d.relationships || [];

    const typeName = node.canonicalType ? node.canonicalType.split("#").pop() : "";
    document.getElementById("so-title").textContent = node.displayName || typeName || nodeId;
    document.getElementById("so-sub").textContent = typeName;

    // Build properties
    const priority = ["id", "status", "canonicalType", "setpoint", "severity", "tier",
      "confidence", "message", "behaviorId", "createdBy", "createdAt", "updatedAt", "changeLogRef"];
    const shown = new Set();
    let propsHtml = "";

    for (const k of priority) {
      if (node[k] != null) {
        shown.add(k);
        let v = node[k];
        if (k === "canonicalType") v = v.split("#").pop();
        if (typeof v === "string" && v.length > 60) v = v.substring(0, 60) + "\u2026";
        propsHtml += `<div class="prop-row"><span class="prop-key">${k}</span><span class="prop-val">${v}</span></div>`;
      }
    }
    for (const [k, v] of Object.entries(node)) {
      if (shown.has(k) || k === "_label" || k === "tenantId") continue;
      let dv = v;
      if (typeof dv === "string" && dv.length > 60) dv = dv.substring(0, 60) + "\u2026";
      propsHtml += `<div class="prop-row"><span class="prop-key">${k}</span><span class="prop-val">${dv}</span></div>`;
    }

    let html = `<div class="slideout-section">
      <div class="slideout-section-title">Properties</div>
      ${propsHtml}
    </div>`;

    if (rels.length) {
      let relsHtml = rels.map(r => {
        const relType = r.rel || r.type || "";
        const target = r.node || r.target || {};
        return `<div class="rel-item">
          <span class="rel-type-tag">${relType}</span>
          <span class="rel-arrow">&rarr;</span>
          <span class="rel-target">${target.displayName || (target.id || "").substring(0, 12)}</span>
        </div>`;
      }).join("");

      html += `<div class="slideout-section">
        <div class="slideout-section-title">Relationships</div>
        ${relsHtml}
      </div>`;
    }

    document.getElementById("so-body").innerHTML = html;
    document.getElementById("so-panel").classList.add("open");
    document.getElementById("so-backdrop").classList.add("open");
  } catch (e) {
    console.error("Detail fetch failed:", e);
  }
}

function closeDetail() {
  document.getElementById("so-panel").classList.remove("open");
  document.getElementById("so-backdrop").classList.remove("open");
}

document.addEventListener("keydown", e => { if (e.key === "Escape") closeDetail(); });

// ── Force-directed graph ──────────────────────────
const G = { nodes: [], edges: [], running: false, hover: null };

const CAT_STYLE = {
  PhysicalAsset: { color: "#1a1714", r: 18, shape: "rect" },
  Location:      { color: "#1d4ed8", r: 14, shape: "circle" },
  Finding:       { color: "#b45309", r: 8,  shape: "diamond" },
  Incident:      { color: "#c23616", r: 10, shape: "diamond" },
  Process:       { color: "#7c3aed", r: 12, shape: "circle" },
  Observation:   { color: "#0891b2", r: 8,  shape: "circle" },
  Actor:         { color: "#4f46e5", r: 12, shape: "circle" },
  Capability:    { color: "#059669", r: 10, shape: "circle" },
  Document:      { color: "#6b7280", r: 10, shape: "circle" },
  MobileAsset:   { color: "#92400e", r: 14, shape: "rect" },
};

function nodeLabel(n) {
  // Short labels only: use displayName for assets/locations, category for findings
  if (n.label === "Finding") {
    const sev = n.severity === "critical" ? "CRIT" : "WARN";
    return `${sev} Finding`;
  }
  if (n.label === "Incident") return "Incident";
  if (n.displayName) {
    // Truncate long names
    return n.displayName.length > 18 ? n.displayName.substring(0, 16) + ".." : n.displayName;
  }
  return n.label;
}

async function pollGraph() {
  try {
    const d = await (await fetch(`${A}/topology?tenant=${T}`)).json();
    document.getElementById("graph-count").textContent =
      `${d.nodes.length} nodes \u00b7 ${d.edges.length} edges`;

    const sig = d.nodes.map(n => n.id).sort().join(",") + "|" + d.edges.length;
    if (G._sig === sig) return;
    G._sig = sig;

    const canvas = document.getElementById("graph-canvas");
    const W = canvas.parentElement.clientWidth;
    const H = canvas.parentElement.clientHeight;

    // Layout: place infrastructure nodes in a structured way, findings orbit
    const infra = d.nodes.filter(n => n.label !== "Finding" && n.label !== "Incident");
    const findings = d.nodes.filter(n => n.label === "Finding" || n.label === "Incident");
    const cx = W / 2, cy = H / 2;

    const prev = {};
    for (const n of G.nodes) prev[n.id] = n;

    const allNodes = [];

    // Infrastructure: spread evenly across center
    const spacing = Math.min(W, H) * 0.25;
    infra.forEach((n, i) => {
      const angle = (i / Math.max(infra.length, 1)) * Math.PI * 2 - Math.PI / 2;
      const p = prev[n.id];
      allNodes.push({
        ...n,
        x: p ? p.x : cx + Math.cos(angle) * spacing,
        y: p ? p.y : cy + Math.sin(angle) * spacing,
        vx: 0, vy: 0,
        r: (CAT_STYLE[n.label] || CAT_STYLE.Document).r,
      });
    });

    // Findings: place near their flagged target
    const edgeMap = {};
    for (const e of d.edges) {
      if (e.type === "FLAGS") edgeMap[e.source] = e.target;
    }

    findings.forEach((n, i) => {
      const targetId = edgeMap[n.id];
      const target = allNodes.find(a => a.id === targetId);
      const p = prev[n.id];
      const bx = target ? target.x : cx;
      const by = target ? target.y : cy;
      const jitter = 40 + i * 15;
      const angle = (i / Math.max(findings.length, 1)) * Math.PI * 2;
      allNodes.push({
        ...n,
        x: p ? p.x : bx + Math.cos(angle) * jitter,
        y: p ? p.y : by + Math.sin(angle) * jitter,
        vx: 0, vy: 0,
        r: (CAT_STYLE[n.label] || CAT_STYLE.Document).r,
      });
    });

    G.nodes = allNodes;
    G.edges = d.edges;

    if (!G.running) {
      G.running = true;
      graphLoop();
    }
  } catch {}
}

function graphLoop() {
  const canvas = document.getElementById("graph-canvas");
  const wrap = canvas.parentElement;

  function tick() {
    const nodes = G.nodes, edges = G.edges;
    if (!nodes.length) { requestAnimationFrame(tick); return; }

    const W = wrap.clientWidth, H = wrap.clientHeight;
    const cx = W / 2, cy = H / 2;
    const map = {};
    for (const n of nodes) map[n.id] = n;

    // Physics
    for (const n of nodes) {
      // Gentle center pull
      n.vx += (cx - n.x) * 0.001;
      n.vy += (cy - n.y) * 0.001;

      // Repulsion (stronger, wider range)
      for (const m of nodes) {
        if (n === m) continue;
        const dx = n.x - m.x, dy = n.y - m.y;
        const d2 = dx * dx + dy * dy;
        const minDist = n.r + m.r + 60;
        if (d2 < minDist * minDist) {
          const dist = Math.sqrt(d2) || 1;
          const f = (minDist - dist) * 0.05;
          n.vx += (dx / dist) * f;
          n.vy += (dy / dist) * f;
        }
      }
    }

    // Edge springs — longer rest length
    for (const e of edges) {
      const s = map[e.source], t = map[e.target];
      if (!s || !t) continue;
      const dx = t.x - s.x, dy = t.y - s.y;
      const dist = Math.sqrt(dx * dx + dy * dy) || 1;
      const rest = s.r + t.r + 90;
      const f = (dist - rest) * 0.008;
      s.vx += (dx / dist) * f;
      s.vy += (dy / dist) * f;
      t.vx -= (dx / dist) * f;
      t.vy -= (dy / dist) * f;
    }

    // Integrate
    for (const n of nodes) {
      n.vx *= 0.82;
      n.vy *= 0.82;
      n.x += n.vx;
      n.y += n.vy;
      n.x = Math.max(n.r + 10, Math.min(W - n.r - 10, n.x));
      n.y = Math.max(n.r + 10, Math.min(H - n.r - 10, n.y));
    }

    renderGraph(canvas, W, H, nodes, edges, map);
    requestAnimationFrame(tick);
  }
  tick();
}

function renderGraph(canvas, W, H, nodes, edges, map) {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);

  // Edges
  for (const e of edges) {
    const s = map[e.source], t = map[e.target];
    if (!s || !t) continue;

    const angle = Math.atan2(t.y - s.y, t.x - s.x);
    const sx = s.x + Math.cos(angle) * s.r;
    const sy = s.y + Math.sin(angle) * s.r;
    const tx = t.x - Math.cos(angle) * t.r;
    const ty = t.y - Math.sin(angle) * t.r;

    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(tx, ty);
    ctx.strokeStyle = e.type === "FLAGS" ? "rgba(180,83,9,0.3)" : "rgba(26,23,20,0.1)";
    ctx.lineWidth = e.type === "FLAGS" ? 1.5 : 1;
    ctx.stroke();

    // Small arrow at target end
    const aLen = 5;
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(tx - aLen * Math.cos(angle - 0.35), ty - aLen * Math.sin(angle - 0.35));
    ctx.lineTo(tx - aLen * Math.cos(angle + 0.35), ty - aLen * Math.sin(angle + 0.35));
    ctx.closePath();
    ctx.fillStyle = e.type === "FLAGS" ? "rgba(180,83,9,0.35)" : "rgba(26,23,20,0.15)";
    ctx.fill();
  }

  // Nodes
  for (const n of nodes) {
    const style = CAT_STYLE[n.label] || CAT_STYLE.Document;
    const isHover = G.hover === n.id;

    // Critical finding pulse
    if (n.label === "Finding" && n.severity === "critical") {
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r + 6, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(194,54,22,0.1)";
      ctx.fill();
    }

    ctx.save();

    if (style.shape === "rect") {
      // Rounded rect for assets
      const hw = n.r, hh = n.r * 0.7;
      ctx.beginPath();
      roundRect(ctx, n.x - hw, n.y - hh, hw * 2, hh * 2, 3);
      ctx.fillStyle = isHover ? style.color : "#fff";
      ctx.fill();
      ctx.strokeStyle = style.color;
      ctx.lineWidth = isHover ? 2.5 : 1.5;
      ctx.stroke();
    } else if (style.shape === "diamond") {
      // Diamond for findings
      const s = n.r;
      ctx.beginPath();
      ctx.moveTo(n.x, n.y - s);
      ctx.lineTo(n.x + s, n.y);
      ctx.lineTo(n.x, n.y + s);
      ctx.lineTo(n.x - s, n.y);
      ctx.closePath();
      ctx.fillStyle = n.severity === "critical" ? "#c23616" : style.color;
      ctx.fill();
      if (isHover) { ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke(); }
    } else {
      // Circle for locations/others
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
      ctx.fillStyle = isHover ? style.color : "#fff";
      ctx.fill();
      ctx.strokeStyle = style.color;
      ctx.lineWidth = isHover ? 2.5 : 1.5;
      ctx.stroke();
    }

    ctx.restore();

    // Label below node
    const lbl = nodeLabel(n);
    ctx.font = (isHover ? "600 " : "") + "10px -apple-system, sans-serif";
    ctx.textAlign = "center";
    ctx.fillStyle = isHover ? style.color : "#1a1714";
    ctx.fillText(lbl, n.x, n.y + n.r + 14);

    // Category tag above node (only for infrastructure)
    if (n.label !== "Finding" && n.label !== "Incident") {
      ctx.font = "8px -apple-system, sans-serif";
      ctx.fillStyle = style.color + "88";
      ctx.fillText(n.label.toUpperCase(), n.x, n.y - n.r - 6);
    }
  }
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
}

// Hover detection on graph
document.getElementById("graph-canvas").addEventListener("mousemove", function(e) {
  const rect = this.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  let found = null;
  for (const n of G.nodes) {
    const dx = n.x - mx, dy = n.y - my;
    if (dx * dx + dy * dy < (n.r + 6) * (n.r + 6)) { found = n.id; break; }
  }
  G.hover = found;
  this.style.cursor = found ? "pointer" : "grab";
});

// Click on graph nodes
document.getElementById("graph-canvas").addEventListener("click", function(e) {
  const rect = this.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  for (const n of G.nodes) {
    const dx = n.x - mx, dy = n.y - my;
    if (dx * dx + dy * dy < (n.r + 6) * (n.r + 6)) { openDetail(n.id); break; }
  }
});

// ── Poll loop ─────────────────────────────────────
async function poll() {
  await Promise.all([pollHealth(), pollStats(), pollFeed(), pollEntities(), pollFindings(), pollLog(), pollGraph()]);
}

poll();
setInterval(poll, 2000);
window.addEventListener("resize", () => { if (hist.length >= 2) drawChart(); });
