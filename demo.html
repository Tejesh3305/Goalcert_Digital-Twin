<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#6d28d9" />
<title>Goalcert — Workforce Intelligence · Interactive Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.17.0/dist/tabler-icons.min.css" />
<style>
:root{
  --font:'Inter',system-ui,-apple-system,sans-serif; --display:'Poppins',var(--font); --mono:'JetBrains Mono',ui-monospace,monospace;
  --brand:#6d28d9; --brand-strong:#5b21b6; --brand-2:#7c3aed; --brand-blue:#2563eb;
  --brand-soft:#f3effc; --brand-softer:#faf8ff; --brand-ring:rgba(109,40,217,.18);
  --gradient:linear-gradient(135deg,#7c3aed 0%,#2563eb 100%);
  --gradient-cta:linear-gradient(135deg,#2e1065 0%,#312e81 60%,#1e3a8a 100%);
  --bg:#f7f7fb; --surface:#fff; --surface2:#f4f3f9; --border:#ebe9f2; --border2:#ddd9ea;
  --text:#16131f; --muted:#6b7280; --hint:#9aa1ad;
  --accent-blue:#2563eb; --accent-teal:#0d9488; --accent-amber:#d97706; --accent-red:#e11d48; --accent-green:#16a34a; --ok:#16a34a;
  --radius:16px; --radius-sm:10px;
  --shadow-sm:0 1px 2px rgba(22,19,31,.05); --shadow:0 4px 16px rgba(22,19,31,.06); --shadow-lg:0 18px 48px rgba(46,16,101,.14); --shadow-brand:0 8px 22px rgba(109,40,217,.22);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#app{height:100%}
body{font-family:var(--font);font-size:13px;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#d8d4e6;border-radius:6px;border:2px solid var(--bg)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes scanmove{0%{top:0}100%{top:100%}}
.mono{font-family:var(--mono)}.muted{color:var(--muted)}.hint{color:var(--hint)}

.app-root{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 18px;background:rgba(255,255,255,.85);backdrop-filter:saturate(140%) blur(8px);border-bottom:1px solid var(--border);flex-shrink:0;z-index:30}
.brand{display:inline-flex;align-items:center;gap:10px;user-select:none}
.brand-mark{width:32px;height:32px;flex-shrink:0;display:block}
.brand-word{display:flex;flex-direction:column;line-height:1}
.brand-name{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:-.01em;color:var(--text)}
.brand-tag{font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--brand-2);font-weight:600;margin-top:3px}
.topbar-breadcrumb{font-size:12.5px;color:var(--muted);flex:1;min-width:0}
.topbar-breadcrumb b{color:var(--text);font-weight:600}
.topbar-stat{font-family:var(--mono);font-size:10.5px;color:var(--muted);background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:4px 10px;white-space:nowrap}
.topbar-stat b{color:var(--text);font-weight:600}
.status-dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(22,163,74,.16);animation:pulse 2.4s ease-in-out infinite;flex-shrink:0}
.tw-select{font-family:var(--font);font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:999px;border:1px solid var(--border2);background:var(--surface);color:var(--text);cursor:pointer;outline:none}
.acct{display:inline-flex;align-items:center;gap:8px;padding:5px 6px 5px 12px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);font-weight:600;font-size:12px;cursor:pointer}
.acct .av{width:26px;height:26px;border-radius:50%;background:var(--gradient);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px}
.body{display:grid;grid-template-columns:230px 1fr;flex:1;min-height:0}
.sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.sidebar-nav{flex:1;overflow-y:auto;padding:16px 12px}
.sidebar-section{padding:14px 12px 6px;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--hint);font-weight:700}
.sidebar-section:first-child{padding-top:4px}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 12px;cursor:pointer;font-size:13.5px;color:var(--muted);font-weight:500;border-radius:var(--radius-sm);margin-bottom:3px;transition:background .14s,color .14s;position:relative}
.nav-item:hover{background:var(--brand-soft);color:var(--text)}
.nav-item.active{background:var(--brand-soft);color:var(--brand-strong);font-weight:600}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:20px;border-radius:3px;background:var(--gradient)}
.nav-item i{font-size:19px;width:20px;flex-shrink:0}
.nav-item.active i{color:var(--brand)}
.nav-badge{margin-left:auto;font-family:var(--mono);font-size:9.5px;padding:1px 7px;border-radius:999px;font-weight:700}
.badge-red{background:rgba(225,29,72,.12);color:var(--accent-red)}.badge-blue{background:rgba(37,99,235,.12);color:var(--accent-blue)}
.sidebar-foot{border-top:1px solid var(--border);padding:12px;display:flex;flex-direction:column;gap:8px}
.sidebar-help{display:flex;align-items:center;gap:9px;padding:11px 12px;border-radius:var(--radius-sm);background:var(--gradient);color:#fff;font-size:12.5px;font-weight:600;cursor:pointer;box-shadow:var(--shadow-brand)}
.sidebar-help i{font-size:17px}
.sidebar-ver{font-size:10px;color:var(--hint);text-align:center;font-family:var(--mono)}
.content{background:var(--bg);overflow-y:auto;padding:24px 26px;position:relative}
.panel{animation:fadeIn .2s ease;max-width:1440px}
.panel-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;gap:14px}
.panel-title{font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:-.02em}
.panel-subtitle{font-size:12.5px;color:var(--muted);margin-top:4px}
.panel-actions{display:flex;gap:8px;flex-shrink:0;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.btn{font-family:var(--font);font-size:12px;font-weight:600;padding:8px 14px;border-radius:999px;border:1px solid var(--border2);background:var(--surface);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .12s,box-shadow .12s,border-color .12s,transform .04s}
.btn:hover{background:var(--surface2)}.btn:active{transform:translateY(.5px)}.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--gradient);color:#fff;border-color:transparent;box-shadow:var(--shadow-brand)}.btn-primary:hover{filter:brightness(1.05)}
.btn-danger{background:var(--accent-red);color:#fff;border-color:transparent}
.btn-ghost{background:transparent;border-color:transparent}.btn-ghost:hover{background:var(--brand-soft)}
.btn i{font-size:15px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.section-gap{margin-bottom:16px}
@media(max-width:1080px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-sm)}
.card-label{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-bottom:6px}
.card-value{font-family:var(--display);font-size:28px;font-weight:600;letter-spacing:-.02em}
.card-change{font-size:11.5px;margin-top:5px;color:var(--muted)}
.card-title{font-family:var(--display);font-size:14px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:7px}
.up{color:var(--accent-green)}.down{color:var(--accent-red)}
.kpi{position:relative;overflow:hidden}.kpi::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:var(--gradient)}
.pill{font-size:10px;padding:3px 9px;border-radius:999px;font-weight:700;font-family:var(--mono);white-space:nowrap}
.pill-blue{background:rgba(37,99,235,.1);color:var(--accent-blue)}.pill-green{background:rgba(22,163,74,.12);color:var(--accent-green)}
.pill-amber{background:rgba(217,119,6,.12);color:var(--accent-amber)}.pill-red{background:rgba(225,29,72,.1);color:var(--accent-red)}.pill-surface{background:var(--surface2);color:var(--muted)}
.event-list{display:flex;flex-direction:column;gap:8px}
.event-item{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border-radius:12px;background:var(--surface);border:1px solid var(--border)}
.event-icon{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.ev-crit{background:rgba(225,29,72,.1);color:var(--accent-red)}.ev-warn{background:rgba(217,119,6,.12);color:var(--accent-amber)}.ev-info{background:rgba(37,99,235,.1);color:var(--accent-blue)}.ev-ok{background:rgba(22,163,74,.12);color:var(--ok)}
.event-body{flex:1;min-width:0}.event-title{font-size:12.5px;font-weight:600}.event-meta{font-size:11.5px;color:var(--muted);margin-top:2px}
.event-time{font-family:var(--mono);font-size:10px;color:var(--hint);white-space:nowrap}
.bar-track{height:8px;border-radius:999px;background:var(--surface2);overflow:hidden}.bar-fill{height:100%;border-radius:999px;transition:width .6s ease}
.bar-row{margin-bottom:12px}.bar-label{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:6px}.bar-label span{color:var(--muted)}.bar-label b{font-family:var(--mono);color:var(--text)}
.sensor-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}@media(max-width:1080px){.sensor-grid{grid-template-columns:1fr 1fr}}
.sensor-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px 15px;position:relative;overflow:hidden;box-shadow:var(--shadow-sm)}
.sensor-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;font-weight:600}
.sensor-value{font-family:var(--display);font-size:21px;font-weight:600}.sensor-unit{font-size:10px;color:var(--muted);margin-left:2px}
.live-indicator{position:absolute;top:11px;right:11px;width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(22,163,74,.15);animation:pulse 1.8s ease-in-out infinite}
.agent-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:9px;box-shadow:var(--shadow-sm)}
.agent-icon{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;background:var(--brand-soft);color:var(--brand)}
.agent-name{font-size:13px;font-weight:600}.agent-status{font-size:11.5px;color:var(--muted)}
.toggle{margin-left:auto;width:38px;height:21px;background:var(--border2);border-radius:999px;position:relative;cursor:pointer;border:none;transition:background .2s;flex-shrink:0}
.toggle.on{background:var(--gradient)}.toggle::after{content:'';position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}.toggle.on::after{transform:translateX(17px)}
.twin-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;cursor:pointer;transition:border-color .14s,transform .14s,box-shadow .14s;position:relative;box-shadow:var(--shadow-sm);overflow:hidden}
.twin-card:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:var(--shadow)}
.twin-name{font-family:var(--display);font-size:15px;font-weight:600;margin-bottom:3px}
.twin-domain{font-size:10.5px;color:var(--brand-2);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.twin-desc{font-size:11.5px;color:var(--muted);margin:10px 0;line-height:1.6}
.twin-meta{display:flex;gap:12px;font-size:10px;color:var(--hint);font-family:var(--mono);margin-top:10px}
.input,.select{width:100%;font-family:var(--font);font-size:12.5px;padding:9px 12px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--surface);color:var(--text);outline:none;transition:border-color .12s,box-shadow .12s}
.input:focus,.select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-ring)}
.empty{padding:40px 18px;text-align:center;color:var(--muted);font-size:12.5px;background:var(--surface);border:1px dashed var(--border2);border-radius:var(--radius)}
.spinner{width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle}
.chat-wrap{display:flex;flex-direction:column;height:500px}
.chat-messages{flex:1;overflow-y:auto;padding:4px 2px;display:flex;flex-direction:column;gap:12px}
.chat-bubble{max-width:82%;padding:11px 14px;border-radius:14px;font-size:12.5px;line-height:1.65}
.bubble-user{align-self:flex-end;background:var(--gradient);color:#fff;border-bottom-right-radius:4px}
.bubble-ai{align-self:flex-start;background:var(--surface2);border:1px solid var(--border);border-bottom-left-radius:4px}
.bubble-label{font-size:10px;color:var(--muted);margin-bottom:4px;font-weight:600}
.chat-input-row{display:flex;gap:10px;margin-top:12px}
.chat-quick{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.quick-chip{font-size:11.5px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--border2);cursor:pointer;color:var(--muted)}
.quick-chip:hover{background:var(--brand-soft);color:var(--brand);border-color:transparent}
.toast-wrap{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:10px;z-index:400}
.toast{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--brand);border-radius:12px;padding:12px 16px;font-size:12.5px;min-width:250px;max-width:380px;box-shadow:var(--shadow-lg);animation:fadeIn .16s ease}
.toast.ok{border-left-color:var(--accent-green)}.toast.err{border-left-color:var(--accent-red)}
.toast-title{font-weight:700;margin-bottom:2px}.toast-msg{color:var(--muted)}
.cta-band{background:var(--gradient-cta);border-radius:var(--radius);padding:24px 26px;color:#fff;position:relative;overflow:hidden}
.cta-band h3{font-family:var(--display);font-weight:600;font-size:18px;margin-bottom:6px}.cta-band p{color:#c9c4ee;font-size:12.5px;max-width:600px;line-height:1.6}
.graph-svg{width:100%;height:440px;border-radius:var(--radius);background:radial-gradient(circle at 50% 40%,#fbfaff,#f3f1fb);border:1px solid var(--border)}
.entity-row{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--border);cursor:pointer;transition:border-color .12s,background .12s}
.entity-row:hover{border-color:var(--border2);background:var(--brand-softer)}
.entity-name{font-size:12.5px;font-weight:600}.entity-id{font-family:var(--mono);font-size:10px;color:var(--hint);margin-left:auto}

/* ===== Upload / scan ===== */
.bp-frame{position:relative;border-radius:14px;overflow:hidden;border:1px solid #20234a;background:#0a0c1c;aspect-ratio:16/10;display:flex;align-items:center;justify-content:center}
.bp-frame svg,.bp-frame img{width:100%;height:100%;object-fit:contain;display:block}
.scanline{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#22d3ee,transparent);box-shadow:0 0 18px 5px rgba(34,211,238,.5);animation:scanmove 2.2s linear infinite;display:none}
.bp-frame.scanning .scanline{display:block}
.scan-log{font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;height:130px;overflow:auto;margin-top:12px}
.scan-log .ok{color:var(--accent-green)}.scan-log .acc{color:var(--brand)}
.dz{border:2px dashed var(--border2);border-radius:14px;background:var(--brand-softer);padding:18px;text-align:center;cursor:pointer;transition:.14s}
.dz.drag{border-color:var(--brand);background:var(--brand-soft)}
.dz .dzic{width:46px;height:46px;border-radius:14px;background:var(--gradient);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 10px;box-shadow:var(--shadow-brand)}
.sample-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.sample-tile{border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;background:#0a0c1c;transition:.12s}
.sample-tile:hover{transform:translateY(-2px);border-color:var(--brand)}
.sample-tile svg{height:74px;width:100%;display:block}
.sample-tile .st-cap{padding:5px 7px;font-size:9.5px;font-weight:600;color:#cdd3ff;background:#0d1030;display:flex;align-items:center;gap:5px}

/* ===== 3D hero ===== */
.hero3d{position:relative;height:74vh;min-height:540px;border-radius:20px;overflow:hidden;border:1px solid #1d2138;box-shadow:var(--shadow-lg);margin-bottom:22px;background:#0b0d18}
.hero3d canvas{display:block}
.v-load{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#cdd3ff;background:#0b0d18;z-index:5;font-family:var(--mono);font-size:12px}
.v-top{position:absolute;top:14px;left:14px;z-index:6;display:flex;gap:8px;align-items:center;pointer-events:none}
.v-chip{background:rgba(12,14,28,.72);backdrop-filter:blur(8px);border:1px solid rgba(124,58,237,.4);color:#dfe3ff;font-family:var(--mono);font-size:11px;padding:6px 12px;border-radius:999px;display:flex;align-items:center;gap:7px;pointer-events:auto}
.v-chip b{color:#fff}
.v-tools{position:absolute;right:14px;top:14px;z-index:6;display:flex;gap:8px;pointer-events:auto}
.v-tool{width:40px;height:40px;border-radius:12px;background:rgba(12,14,28,.72);border:1px solid rgba(124,58,237,.4);color:#cdd3ff;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;backdrop-filter:blur(8px);transition:.12s}
.v-tool:hover{background:rgba(124,58,237,.4);color:#fff}.v-tool.on{background:var(--gradient);color:#fff;border-color:transparent}
.v-floors{position:absolute;left:14px;bottom:14px;z-index:6;display:flex;flex-direction:column;gap:6px;pointer-events:auto}
.v-floor{padding:7px 12px;border-radius:10px;background:rgba(12,14,28,.72);border:1px solid rgba(124,58,237,.4);color:#cdd3ff;font-size:11px;font-weight:600;cursor:pointer;backdrop-filter:blur(8px);min-width:104px;text-align:left}
.v-floor.on{background:var(--gradient);color:#fff;border-color:transparent}
.v-palette{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:7;display:flex;gap:6px;background:rgba(12,14,28,.8);border:1px solid rgba(124,58,237,.4);border-radius:14px;padding:8px;backdrop-filter:blur(10px);pointer-events:auto;max-width:80%;flex-wrap:wrap;justify-content:center}
.v-pal-item{display:flex;flex-direction:column;align-items:center;gap:3px;width:62px;padding:8px 4px;border-radius:10px;color:#cdd3ff;cursor:pointer;font-size:9px;text-align:center;transition:.12s}
.v-pal-item:hover{background:rgba(124,58,237,.32);color:#fff}.v-pal-item i{font-size:19px}
.v-trash{position:absolute;bottom:14px;right:14px;z-index:8;width:54px;height:54px;border-radius:16px;background:rgba(12,14,28,.8);border:1px dashed rgba(225,29,72,.5);color:#fda4af;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;gap:1px;backdrop-filter:blur(10px);pointer-events:auto;transition:.14s}
.v-trash span{font-size:7.5px;font-family:var(--mono);letter-spacing:.05em}
.v-trash.hot{background:#e11d48;color:#fff;transform:scale(1.14);border-style:solid}
.v-tip{position:absolute;bottom:78px;left:50%;transform:translateX(-50%);z-index:6;font-family:var(--mono);font-size:10.5px;color:#aab0e0;background:rgba(12,14,28,.6);border:1px solid rgba(124,58,237,.3);border-radius:999px;padding:5px 14px;backdrop-filter:blur(8px);pointer-events:none}
.v-tooltip{position:absolute;z-index:9;background:rgba(12,14,28,.92);border:1px solid rgba(124,58,237,.5);color:#e7eaff;font-size:11px;padding:5px 9px;border-radius:8px;pointer-events:none;font-family:var(--mono);display:none;white-space:nowrap}

    concrete:new THREE.MeshStandardMaterial({color:0x70747e,roughness:.96,metalness:0}),
    slab:new THREE.MeshStandardMaterial({color:0xc9ccd4,roughness:.85,metalness:.05}),
    metal:new THREE.MeshStandardMaterial({color:0xa7adb8,roughness:.34,metalness:.95,envMapIntensity:1}),
    steel:new THREE.MeshStandardMaterial({color:0x6b7280,roughness:.45,metalness:.85}),
    dark:new THREE.MeshStandardMaterial({color:0x20232c,roughness:.5,metalness:.6}),
    rack:new THREE.MeshStandardMaterial({color:0x17181e,roughness:.55,metalness:.4}),
    white:new THREE.MeshStandardMaterial({color:0xeef1f5,roughness:.6,metalness:.05}),
    plastic:new THREE.MeshStandardMaterial({color:0x2a2e38,roughness:.7,metalness:.1}),
    rubber:new THREE.MeshStandardMaterial({color:0x16181d,roughness:.95,metalness:0}),
    glass:new THREE.MeshStandardMaterial({color:0x9fc2e8,roughness:.05,metalness:0,transparent:true,opacity:.22,envMapIntensity:1.6}),
    accent:new THREE.MeshStandardMaterial({color:0x7c3aed,roughness:.4,metalness:.3,emissive:0x3b1378,emissiveIntensity:.4}),
    amber:new THREE.MeshStandardMaterial({color:0xf59e0b,roughness:.5,metalness:.4}),
    warm:new THREE.MeshStandardMaterial({color:0xfff1d6,emissive:0xffcf8a,emissiveIntensity:1.6}),
    cool:new THREE.MeshStandardMaterial({color:0xeaf3ff,emissive:0x9ec9ff,emissiveIntensity:1.4}),
    screen:new THREE.MeshStandardMaterial({color:0x0a1530,emissive:0x2f6bd6,emissiveIntensity:.9}),
    led:c=>new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:1.8}),
  };
}

function pStatusPin(color){const g=new THREE.Group();const m=new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:1.6});const s=new THREE.Mesh(new THREE.SphereGeometry(.32,16,16),m);const halo=new THREE.Mesh(new THREE.SphereGeometry(.55,16,16),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.22}));g.add(s,halo);g.userData.pin=true;return g;}
function pRack(M){const g=grp();g.add(box(2,7.4,2.6,M.rack,0,3.7,0));g.add(box(1.7,7,.1,M.dark,0,3.7,1.31));// vented door
  // led strip
  for(let i=0;i<10;i++){const c=Math.random()>.5?0x22d3ee:0x16a34a;const led=new THREE.Mesh(new THREE.BoxGeometry(.12,.16,.04),M.led(c));led.position.set(-.7,1.1+i*.62,1.34);led.userData.blink=true;g.add(led);}
  g.add(box(2.1,.2,2.7,M.dark,0,.1,0));return g;}
function pCRAC(M){const g=grp();g.add(box(3.4,6,2.4,M.metal,0,3,0));// grille

function pRobot(M){const g=grp();g.add(cyl(1,1.3,.6,M.dark,0,.3,0));const base=cyl(.8,.8,1.2,M.amber,0,1.1,0);g.add(base);

/* ---- environment structure builders ---- */
const FH=10;
function structure(key,M,scene){
  const e=ENV[key];
  // building shell per env
  if(key==='datacenter'){
    scene.add(box(44,.3,34,M.slab,0,.15,0)); // raised floor
    // floor tile lines
    addWalls(M,scene,44,12,34,0x2a2d3a);
    ceilingLights(M,scene,44,34,12,4,3);
    // empty rack rows (decor)
    for(let r=0;r<2;r++)for(let i=0;i<3;i++){const rk=pRack(M);rk.position.set(-6+i*4,0,r?10:-12);rk.traverse(o=>{if(o.userData&&o.userData.blink)o.userData.blink=false;});scene.add(rk);}
  } else if(key==='office'){
    for(let f=0;f<e.floors;f++){const y=f*FH;scene.add(box(40,.5,30,M.slab,0,y+.25,0));
      // glass facade
      facade(M,scene,40,30,FH,y);
      // desks
      if(f<e.floors){for(let i=0;i<5;i++){const d=deskCluster(M);d.position.set(-12+i*3.4,y,f===0?-4:2);scene.add(d);}}
      if(f>0){const mr=meetingRoom(M);mr.position.set(11,y,-6);scene.add(mr);}
    }
    scene.add(box(6,e.floors*FH,6,M.dark,-15,e.floors*FH/2,-12)); // core
    scene.add(reception(M));
  } else if(key==='hospital'){
    for(let f=0;f<e.floors;f++){const y=f*FH;scene.add(box(40,.5,30,M.slab,0,y+.25,0));facade(M,scene,40,30,FH,y);
      for(let i=0;i<4;i++){const b=hospBed(M);b.position.set(-12+i*4,y,f===0?7:5);scene.add(b);}
      dividers(M,scene,y);
    }
    scene.add(reception(M));
    // ambulance canopy
    scene.add(box(12,.4,8,M.white,18,5,12));scene.add(cyl(.3,.3,5,M.steel,13,2.5,9));scene.add(cyl(.3,.3,5,M.steel,23,2.5,9));
    scene.add(box(4,2.4,7,M.white,18,1.2,12)); // ambulance body
    scene.add(box(4.1,1,2,M.led(0xe11d48),18,2.7,9));
  } else if(key==='factory'){
    scene.add(box(50,.3,38,M.concrete,0,.15,0));
    addWalls(M,scene,50,14,38,0x3a3d48);
    // roof trusses
    for(let i=-4;i<=4;i++){const t=box(50,.3,.3,M.steel,0,13.5,i*4);scene.add(t);}
    // storage racks
    for(let i=0;i<3;i++){const s=storageRack(M);s.position.set(-20+i*3,0,14);scene.add(s);}
    // gantry
    scene.add(box(.6,.6,38,M.amber,0,12,0));scene.add(box(2,1,2,M.dark,0,11,-2));
    ceilingLights(M,scene,50,38,14,5,4);
  }
}
function addWalls(M,scene,w,h,d,col){const wm=new THREE.MeshStandardMaterial({color:col,roughness:.9,metalness:.1,side:THREE.DoubleSide});
  scene.add(box(w,h,.4,wm,0,h/2,-d/2));scene.add(box(.4,h,d,wm,-w/2,h/2,0));scene.add(box(.4,h,d,wm,w/2,h/2,0));}
function ceilingLights(M,scene,w,d,h,nx,nz){for(let i=0;i<nx;i++)for(let j=0;j<nz;j++){const x=-w/2+w/(nx+1)*(i+1),z=-d/2+d/(nz+1)*(j+1);const p=new THREE.Mesh(new THREE.BoxGeometry(3,.2,1),M.cool);p.position.set(x,h-.4,z);scene.add(p);}}
function facade(M,scene,w,d,h,y){const fr=M.dark;
  [[-w/2,0,'z'],[w/2,0,'z']].forEach(()=>{});
  // 4 sides glass
  scene.add(box(w,h-1,.12,M.glass,0,y+h/2,-d/2));scene.add(box(w,h-1,.12,M.glass,0,y+h/2,d/2));
  scene.add(box(.12,h-1,d,M.glass,-w/2,y+h/2,0));scene.add(box(.12,h-1,d,M.glass,w/2,y+h/2,0));
  // frames
  for(let i=-w/2;i<=w/2;i+=5){scene.add(box(.18,h-1,.18,fr,i,y+h/2,-d/2));scene.add(box(.18,h-1,.18,fr,i,y+h/2,d/2));}
}
function deskCluster(M){const g=grp();g.add(box(2.6,.12,1.4,M.white,0,1.4,0));for(const[dx,dz]of[[-1.1,-.5],[1.1,-.5],[-1.1,.5],[1.1,.5]])g.add(box(.1,1.4,.1,M.steel,dx,.7,dz));
  g.add(box(1,.6,.06,M.screen,0,1.9,-.5));g.add(box(.7,.06,.5,M.dark,0,1.5,.3));// keyboard
  g.add(box(.5,.5,.5,M.plastic,-.9,1.7,.4)); // chair-ish
  return g;}
function meetingRoom(M){const g=grp();g.add(box(.1,FH-2,8,M.glass,-4,FH/2-1,0));g.add(box(8,FH-2,.1,M.glass,0,FH/2-1,-4));g.add(box(3,.15,1.4,M.white,0,1.5,0));return g;}
function reception(M){const g=grp();g.add(box(5,1.4,1.6,M.accent,0,.7,11));g.add(box(5,.1,1.8,M.white,0,1.45,11));return g;}
function hospBed(M){const g=grp();g.add(box(1.4,.1,3,M.metal,0,1.3,0));g.add(box(1.3,.3,2.8,M.white,0,1.45,0));g.add(box(1.3,.3,.6,M.white,0,1.7,-1.1));// headboard
  g.add(box(1,.4,.5,M.cool,0,1.8,-1.2));for(const[dx,dz]of[[-.6,-1.3],[.6,-1.3],[-.6,1.3],[.6,1.3]])g.add(cyl(.12,.12,1.3,M.steel,dx,.65,dz));return g;}
function dividers(M,scene,y){for(let i=-1;i<=1;i++)scene.add(box(.15,3.5,12,M.glass,i*9,y+1.75,0));}
function storageRack(M){const g=grp();for(let lvl=0;lvl<3;lvl++)g.add(box(2.4,.15,8,M.steel,0,2+lvl*3,0));for(const dz of[-3.8,3.8])for(const dx of[-1.1,1.1])g.add(box(.18,8,.18,M.steel,dx,4,dz));
  for(let lvl=0;lvl<3;lvl++)for(let i=0;i<2;i++)g.add(box(1.6,1.4,1.6,M.amber,0,2.8+lvl*3,-2.5+i*5));return g;}

function mountViewer(host,key){
  host.innerHTML='';
  const load=el('div',{class:'v-load'},el('div',{class:'spinner',style:{width:'30px',height:'30px',borderTopColor:'#7c3aed'}}),'Rendering 3-D twin…');
  host.append(load);
  let api; try{ api=buildViewer(host,key,()=>load.remove()); }catch(err){ console.error(err); load.textContent='3-D failed to load: '+err.message; return; }
  _3d=api;
}

function buildViewer(host,key,onReady){
  const e=ENV[key], M=makeMats();
  const W=()=>host.clientWidth||800, H=()=>host.clientHeight||540;
  const scene=new THREE.Scene();
  // blue-hour sky gradient background
  scene.background=skyTexture();
  scene.fog=new THREE.Fog(0x1a2444,70,200);
  const camera=new THREE.PerspectiveCamera(48,W()/H(),0.1,2000);
  const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
  renderer.setSize(W(),H());renderer.setPixelRatio(Math.min(2,window.devicePixelRatio));
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;
  host.append(renderer.domElement);
  // IBL
  const pmrem=new THREE.PMREMGenerator(renderer);
  scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
  // lights
  scene.add(new THREE.HemisphereLight(0x9fb4ff,0x202734,0.55));
  const sun=new THREE.DirectionalLight(0xbcd0ff,1.5);sun.position.set(38,60,28);sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.near=1;sun.shadow.camera.far=200;
  const sc=sun.shadow.camera;sc.left=-60;sc.right=60;sc.top=60;sc.bottom=-60;sun.shadow.bias=-0.0004;scene.add(sun);
  const fill=new THREE.DirectionalLight(0xffe9c2,0.4);fill.position.set(-30,25,-20);scene.add(fill);
  const accent=new THREE.PointLight(e.accent,0.8,120);accent.position.set(0,18,0);scene.add(accent);
  // ground
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(400,400),groundMat());
  ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
  const grid=new THREE.GridHelper(400,80,0x2a3358,0x1b2138);grid.material.transparent=true;grid.material.opacity=.35;grid.position.y=.01;scene.add(grid);

  // build structures + assets
  const selectable=[]; const animators=[]; const floorGroups={};
  try{ structure(key,M,scene); }catch(err){ console.warn('structure',err); }
  scene.traverse(o=>{ if(o.userData&&(o.userData.blink||o.userData.spin||o.userData.belt||o.userData.robot||o.userData.cargo||o.userData.press)) animators.push(o); });

  function placeAsset(data){
    const make=PROP_FOR[data.type]||pSensor;
    const g=make(M);
    g.position.set(data.x, (data.f||0)*FH, data.z);
    // status pin
    g.userData.topY=propTop(g);
    const pin=pStatusPin(statusColor[data.status]); pin.position.set(0, g.userData.topY+1.2, 0); g.add(pin);
    g.userData.asset=data; g.userData.pin=pin;
    g.traverse(o=>{o.userData.pickRoot=g;});
    scene.add(g); selectable.push(g);
    // collect new animators
    g.traverse(o=>{ if(o.userData&&(o.userData.blink||o.userData.spin||o.userData.belt||o.userData.robot||o.userData.cargo||o.userData.press)) animators.push(o); });
    return g;
  }
  function propTop(g){const b=new THREE.Box3().setFromObject(g);return isFinite(b.max.y)?b.max.y:4;}
  runtimeAssets[key].forEach(a=>placeAsset(a));

  {name:'Diagnosis Agent',icon:'ti-stethoscope',on:true,desc:'Root-causes findings from telemetry + graph'},

/* ============================================================

(function boot(){const r=location.hash.replace('#/','');if(r&&VIEWS[r])STATE.route=r;renderShell();})();

/* ============================================================
   GUIDED TOUR  —  "Aria", an assistant that walks a new user
   through every feature of the platform with spotlight tooltips.
   ============================================================ */
(function guidedTour(){
  const TOUR_KEY='gc_tour_done_v1';

  // ---- styles (injected so the demo stays a single file) ----
  const css=`
  .gc-tour-mask{position:fixed;inset:0;z-index:99990;background:transparent;cursor:default;}
  .gc-tour-spot{position:fixed;z-index:99991;border-radius:12px;pointer-events:none;opacity:0;
    transition:all .32s cubic-bezier(.4,0,.2,1);}
  .gc-tour-pop{position:fixed;z-index:99995;width:330px;max-width:calc(100vw - 28px);
    background:#0f1222;color:#eef1ff;border:1px solid #2a2f55;border-radius:16px;
    box-shadow:0 24px 60px rgba(0,0,0,.5);padding:0;overflow:hidden;
    font-family:var(--ui,'Inter',system-ui,sans-serif);animation:gcPop .26s cubic-bezier(.34,1.3,.5,1);}
  @keyframes gcPop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
  .gc-tour-head{display:flex;align-items:center;gap:11px;padding:15px 16px 12px;
    background:linear-gradient(120deg,rgba(124,58,237,.22),rgba(37,99,235,.18));border-bottom:1px solid #23284a;}
  .gc-tour-av{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;
    background:linear-gradient(135deg,#7c3aed,#2563eb);box-shadow:0 4px 14px rgba(124,58,237,.5);
    color:#fff;font-size:19px;}
  .gc-tour-who{font-weight:700;font-size:13.5px;letter-spacing:.01em;}
  .gc-tour-sub{font-size:10.5px;color:#9aa3d6;font-family:var(--mono,monospace);margin-top:1px;}
  .gc-tour-x{margin-left:auto;cursor:pointer;color:#8b93c4;font-size:17px;line-height:1;padding:4px;border-radius:8px;}
  .gc-tour-x:hover{background:rgba(255,255,255,.08);color:#fff;}
  .gc-tour-body{padding:14px 16px 4px;}
  .gc-tour-title{font-size:15px;font-weight:650;margin-bottom:5px;}
  .gc-tour-text{font-size:12.8px;line-height:1.55;color:#c7ccec;}
  .gc-tour-foot{display:flex;align-items:center;gap:8px;padding:12px 16px 15px;}
  .gc-tour-dots{display:flex;gap:5px;margin-right:auto;}
  .gc-tour-dot{width:6px;height:6px;border-radius:50%;background:#343a63;transition:.2s;}
  .gc-tour-dot.on{background:#7c3aed;width:18px;border-radius:4px;}
  .gc-tour-btn{font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:9px;border:1px solid #2c3160;
    background:#171b33;color:#cdd3f5;cursor:pointer;transition:.14s;font-family:inherit;}
  .gc-tour-btn:hover{background:#1e2342;border-color:#3a4080;}
  .gc-tour-btn.primary{background:linear-gradient(135deg,#7c3aed,#2563eb);border:none;color:#fff;}
  .gc-tour-btn.primary:hover{filter:brightness(1.08);}
  .gc-tour-btn.ghost{background:transparent;border:none;color:#8b93c4;padding-left:4px;}
  .gc-tour-btn.ghost:hover{color:#fff;background:transparent;}
  .gc-tour-fab{position:fixed;right:22px;bottom:22px;z-index:99980;display:flex;align-items:center;gap:9px;
    padding:11px 16px 11px 13px;border-radius:30px;cursor:pointer;color:#fff;border:none;
    background:linear-gradient(135deg,#7c3aed,#2563eb);box-shadow:0 10px 28px rgba(124,58,237,.45);
    font-family:var(--ui,system-ui,sans-serif);font-weight:600;font-size:13px;transition:.16s;}
  .gc-tour-fab:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(124,58,237,.55);}
  .gc-tour-fab i{font-size:17px;}
  @keyframes gcPulse{0%,100%{box-shadow:0 0 0 9999px rgba(8,10,22,.66),0 0 0 0 rgba(124,58,237,.55)}
    50%{box-shadow:0 0 0 9999px rgba(8,10,22,.66),0 0 0 7px rgba(124,58,237,0)}}
  .gc-tour-spot.lit{animation:gcPulse 2.1s ease-out infinite;border:2px solid rgba(124,58,237,.9);}
  `;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);

  // ---- the script Aria follows ----
  const STEPS=[
    {title:'Welcome to Goalcert',
     text:"Hi, I'm <b>Aria</b> — your guide. In about a minute I'll show you how this digital-twin platform turns a flat 2-D plan into a living, interactive 3-D building. Ready?",
     center:true},
    {sel:'.tw-select',side:'bottom',title:'Switch between twins',
     text:"Each twin is a different facility — a <b>data center</b>, <b>hospital</b>, <b>factory</b>, or <b>smart office</b>. Pick one here and the whole workspace re-scopes to it."},
    {sel:'.sidebar',side:'right',title:'Your workspace',
     text:"Navigate the platform from here: the live <b>Dashboard</b>, <b>Build a Twin</b> from a plan, your <b>Twins</b> library, and the <b>AI Agents</b> working behind the scenes."},
    {route:'dashboard',sel:'.hero3d',side:'left',title:'Your living 3-D twin',
     text:"This is the reconstructed building, rendered in real time. <b>Drag to orbit</b>, <b>scroll to zoom</b>, and <b>click any equipment</b> to inspect its live telemetry. Healthy assets glow green; problems turn amber or red."},
    {route:'dashboard',sel:'.grid-4',side:'bottom',title:'Operations at a glance',
     text:"The headline KPIs — a rolled-up <b>risk score</b>, asset count, <b>active findings</b>, and uptime — so you know the building's health in one look."},
    {route:'dashboard',sel:'.graph-svg',side:'right',title:'The knowledge graph',
     text:"Under the 3-D is an <b>ontology</b>: every asset and how it connects (what feeds what, what's in which room). This is what lets the platform reason about cause and effect."},
    {route:'dashboard',sel:'.event-list',side:'left',title:'Live findings',
     text:"As telemetry streams in, rule-based <b>findings</b> appear here, colour-coded by severity — and the affected equipment lights up on the 3-D model."},
    {route:'dashboard',sel:'.sensor-grid',side:'top',title:'Real-time telemetry',
     text:"Live sensor readings update continuously. This is the heartbeat that drives the findings, the 3-D status colours, and the agents."},
    {route:'build',sel:'.chat-wrap',side:'right',title:'Build a twin from a plan',
     text:"Here's the magic. <b>Chat with the AI builder</b>, tell it what kind of facility you have, then <b>drop a 2-D floor plan</b> (PNG, PDF, even a sample). It vectorises the plan, detects rooms and equipment, validates against the ontology, and reconstructs it in 3-D."},
    {route:'build',sel:'.chat-quick',side:'bottom',title:'Start the conversation',
     text:"Pick what to model to kick things off — the assistant then asks for your floors and plan, and builds the roamable twin you saw on the dashboard."},
    {route:'twins',sel:'.twin-card',side:'right',title:'Your twins library',
     text:"Every twin you build lands here with its asset count and health. <b>Open any card</b> to jump straight into its live 3-D view."},
    {route:'agents',sel:'.agent-row',side:'right',title:'AI agents do the work',
     text:"Autonomous agents operate over the live graph — the <b>Twin Builder</b>, <b>Diagnosis</b>, <b>Recommender</b>, and <b>Predictive</b> agents. Toggle any on or off here."},
    {title:"You're all set!",
     text:"That's the whole loop: <b>drop a plan → get a living building → let the agents watch it</b>. Explore freely, switch twins, click around the 3-D. Tap the <b>✦ Tour</b> button anytime to replay this.",
     center:true}
  ];

  let idx=0, mask=null, spot=null, pop=null, curTarget=null;

  function ensureEls(){
    if(mask) return;
    mask=document.createElement('div');mask.className='gc-tour-mask';
    spot=document.createElement('div');spot.className='gc-tour-spot';
    pop=document.createElement('div');pop.className='gc-tour-pop';
    document.body.append(mask,spot,pop);
    window.addEventListener('resize',reposition);
    window.addEventListener('scroll',reposition,true);
    document.addEventListener('keydown',onKey);
  }
  function onKey(e){if(!pop)return;if(e.key==='Escape')endTour();else if(e.key==='ArrowRight')next();else if(e.key==='ArrowLeft')prev();}

  function clamp(v,min,max){return Math.max(min,Math.min(max,v));}

  function place(s,t){
    const vw=innerWidth,vh=innerHeight;
    // popover content
    pop.innerHTML='';
    const head=document.createElement('div');head.className='gc-tour-head';
    head.innerHTML=`<div class="gc-tour-av"><i class="ti ti-sparkles"></i></div>
      <div><div class="gc-tour-who">Aria · Platform Guide</div><div class="gc-tour-sub">step ${idx+1} of ${STEPS.length}</div></div>`;
    const x=document.createElement('div');x.className='gc-tour-x';x.innerHTML='<i class="ti ti-x"></i>';x.onclick=endTour;head.append(x);
    const body=document.createElement('div');body.className='gc-tour-body';
    body.innerHTML=`<div class="gc-tour-title">${s.title}</div><div class="gc-tour-text">${s.text}</div>`;
    const foot=document.createElement('div');foot.className='gc-tour-foot';
    const dots=document.createElement('div');dots.className='gc-tour-dots';
    STEPS.forEach((_,i)=>{const d=document.createElement('div');d.className='gc-tour-dot'+(i===idx?' on':'');dots.append(d);});
    foot.append(dots);
    if(idx>0){const b=document.createElement('button');b.className='gc-tour-btn';b.textContent='Back';b.onclick=prev;foot.append(b);}
    const nb=document.createElement('button');nb.className='gc-tour-btn primary';
    nb.textContent=idx===STEPS.length-1?'Finish':'Next';nb.onclick=next;foot.append(nb);
    pop.append(head,body,foot);

    const pw=pop.offsetWidth,ph=pop.offsetHeight;

    if(!t || s.center){
      spot.style.opacity='0';spot.className='gc-tour-spot';
      pop.style.left=clamp((vw-pw)/2,12,vw-pw-12)+'px';
      pop.style.top=clamp((vh-ph)/2,12,vh-ph-12)+'px';
      return;
    }
    const r=t.getBoundingClientRect();const pad=8;
    spot.style.opacity='1';spot.className='gc-tour-spot lit';
    spot.style.left=(r.left-pad)+'px';spot.style.top=(r.top-pad)+'px';
    spot.style.width=(r.width+pad*2)+'px';spot.style.height=(r.height+pad*2)+'px';

    // choose a side with room
    const gap=16;let side=s.side||'right';
    const fits={right:r.right+gap+pw<vw,left:r.left-gap-pw>0,bottom:r.bottom+gap+ph<vh,top:r.top-gap-ph>0};
    if(!fits[side]) side=['right','left','bottom','top'].find(k=>fits[k])||'center';
    let left,top;
    if(side==='right'){left=r.right+gap;top=r.top+r.height/2-ph/2;}
    else if(side==='left'){left=r.left-gap-pw;top=r.top+r.height/2-ph/2;}
    else if(side==='bottom'){top=r.bottom+gap;left=r.left+r.width/2-pw/2;}
    else if(side==='top'){top=r.top-gap-ph;left=r.left+r.width/2-pw/2;}
    else {left=(vw-pw)/2;top=(vh-ph)/2;}
    pop.style.left=clamp(left,12,vw-pw-12)+'px';
    pop.style.top=clamp(top,12,vh-ph-12)+'px';
  }

  function reposition(){if(pop&&idx>=0)place(STEPS[idx],curTarget);}

  function showStep(i){
    idx=i;const s=STEPS[i];ensureEls();
    const needGo=s.route&&STATE.route!==s.route;
    if(needGo)go(s.route);
    const after=()=>{
      const t=s.sel?document.querySelector(s.sel):null;curTarget=t;
      if(t){t.scrollIntoView({block:'center',inline:'center',behavior:'smooth'});setTimeout(()=>{curTarget=document.querySelector(s.sel);place(s,curTarget);},340);}
      else place(s,null);
    };
    setTimeout(after,needGo?520:30);
  }
  function next(){if(idx<STEPS.length-1)showStep(idx+1);else endTour();}
  function prev(){if(idx>0)showStep(idx-1);}

  function startTour(){idx=0;showStep(0);}
  function endTour(){
    localStorage.setItem(TOUR_KEY,'1');
    [mask,spot,pop].forEach(n=>n&&n.remove());mask=spot=pop=curTarget=null;
    window.removeEventListener('resize',reposition);
    window.removeEventListener('scroll',reposition,true);
    document.removeEventListener('keydown',onKey);
  }

  // ---- launcher (always available) ----
  const fab=document.createElement('button');fab.className='gc-tour-fab';
  fab.innerHTML='<i class="ti ti-sparkles"></i> Tour';
  fab.title='Replay the guided tour';
  fab.onclick=startTour;document.body.appendChild(fab);

  // auto-start once for a first-time visitor
  if(!localStorage.getItem(TOUR_KEY)){setTimeout(startTour,900);}

  window.startGoalcertTour=startTour; // handy for replays from the console
})();
</script>
