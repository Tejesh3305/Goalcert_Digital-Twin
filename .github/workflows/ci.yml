# ci.yml — the platform's automated verification.
#
# WHY THIS EXISTS
# ---------------
# There were 33k lines of Python, 13k of JSX, and four hand-run `*_test.py`
# scripts. That is not merely untidy: an enterprise vendor security questionnaire
# asks directly how changes are verified, and "manually" ends the conversation at
# any buyer with a procurement function. This file is the answer, and it is also
# what keeps the tenant-isolation fix from silently regressing — that bug existed
# because nothing checked for it.
#
# TWO JOBS, ON PURPOSE
# --------------------
#   unit         no external services. Fast (~40s), runs on every push, and is
#                the gate. Everything in the platform is written to degrade
#                gracefully when a store is down (a product requirement, RUN.md
#                §10), so authorization, validation and the historian's own logic
#                are all genuinely testable with nothing running.
#   integration  MySQL 8 + Neo4j + Redis via service containers. Proves the
#                MySQL path specifically: the upsert and reserved-word rewrites
#                in db/core.py, GET_LOCK advisory locking, and the historian's
#                window-function queries are all no-ops or different code on the
#                SQLite fallback, so without this job the production backend is
#                the one configuration nothing tests.

name: CI

on:
  push:
    branches: [main, "demo/**", "feat/**", "fix/**", "cleanup/**", "pivot/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # The PINNED ruff from requirements-dev.txt, never a bare `pip install
      # ruff`. See the comment on that pin: an unpinned install made this gate
      # run a different linter from the local one, so a new ruff release turned
      # unrelated pull requests red.
      - name: Install ruff
        run: pip install "$(grep -E '^ruff==' requirements-dev.txt)"
      # BLOCKING. This was `continue-on-error: true` while the pre-linting
      # backlog was cleared; a report nobody is forced to act on is a report
      # nobody reads. The rules live in pyproject.toml.
      - name: Ruff
        run: ruff check nextxr-ontology tests --output-format=github

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -m "not integration" --cov --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage.xml
          if-no-files-found: ignore

  # The tenant-isolation sweep, on its own, so a failure here is unmistakable in
  # the checks list. It asks the app which routes carry a tenant identifier and
  # then attacks every one of them, which means a route added later is covered
  # automatically — the original bug survived precisely because enforcement was
  # per-route and each new route silently opted out.
  isolation:
    name: Tenant isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Cross-tenant authorization must hold
        run: python -m pytest tests/test_tenant_isolation.py -v

      # Authentication, on its own, for the same reason: a regression here is not
      # "a test failed", it is "the API is open" or "logins are broken", and both
      # deserve their own unmistakable red check.
      - name: Authentication must hold
        run: python -m pytest tests/test_auth_enforcement.py tests/test_identity.py -v

  # ── Security ────────────────────────────────────────────────────────────
  #
  # Two scanners with different jobs: pip-audit reads the dependency tree for
  # known CVEs (someone else's code), bandit reads ours for insecure patterns.
  # Neither replaces review; both catch the class of thing review reliably misses.
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Known vulnerabilities in dependencies
        # Advisory for now. A CVE in a transitive dependency with no fix released
        # would otherwise block every unrelated pull request, and a gate people
        # routinely bypass is not a gate. The finding still appears in the log and
        # in the summary, which is what makes it actionable.
        continue-on-error: true
        run: pip-audit --desc --strict

      - name: Insecure patterns in our own code
        # BLOCKING at HIGH severity. These are our bugs, not upstream's: hardcoded
        # credentials, shell injection, weak crypto, disabled certificate
        # verification. Every one is something we can fix in the pull request that
        # introduced it.
        run: |
          bandit -r nextxr-ontology \
            --severity-level high --confidence-level medium \
            --exclude nextxr-ontology/server/threed_platform \
            -f screen

      - name: No credentials committed
        # A cheap, targeted sweep for the specific patterns this repository could
        # plausibly leak. Not a replacement for GitHub secret scanning (which sees
        # the full history) — this catches the mistake in the pull request that
        # makes it, which is when it is still cheap to fix.
        run: |
          set +e
          FOUND=0
          # A real Anthropic key, an AWS access key id, or a private key block.
          for pattern in \
            'sk-ant-api[0-9]{2}-[A-Za-z0-9_-]{20,}' \
            'AKIA[0-9A-Z]{16}' \
            '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' ; do
            if git grep -nIE "$pattern" -- ':!*.md' ':!.github/workflows/*' ':!tests/*' ; then
              echo "::error::A credential pattern is committed (see above)."
              FOUND=1
            fi
          done
          exit $FOUND

  integration:
    name: Integration (MySQL 8 + Neo4j + Redis)
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/testpassword
          NEO4J_PLUGINS: '["apoc"]'
        ports: ["7687:7687", "7474:7474"]
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testpassword 'RETURN 1'"
          --health-interval 10s --health-timeout 5s --health-retries 20
      # MySQL 8, matching RDS. NOT 5.7 and NOT MariaDB: the historian's
      # `latest()` and rollup queries use `ROW_NUMBER() OVER (...)`, which
      # neither has — a deploy onto one would provision cleanly and then fail on
      # the first history read. `test_dialect_is_mysql_and_server_is_8_or_newer`
      # asserts the floor rather than trusting this tag.
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: nextxr
          MYSQL_USER: nextxr
          MYSQL_PASSWORD: testpassword
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -ptestpassword"
          --health-interval 10s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 10
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: testpassword
      NXR_DATABASE_URL: mysql://nextxr:testpassword@127.0.0.1:3306/nextxr
      NXR_REDIS_URL: redis://localhost:6379/0
      # The production posture, asserted rather than assumed. If any required
      # dependency is missing the app refuses to boot — which is exactly the
      # behaviour we want to have tested, since these guards are the only thing
      # standing between a deploy and a silent per-task fallback.
      NXR_REQUIRE_DB: "1"
      NXR_REQUIRE_REDIS: "1"
      NXR_REQUIRE_HISTORIAN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Provision relational schema
        run: python -m db.schema
        working-directory: nextxr-ontology
      - name: Apply migrations
        # The deploy runs these as a one-off task before the service rolls
        # (AWS_DEPLOYMENT.md §14). Running them here is what proves a fresh
        # database and a migrated one end up the same shape — the disagreement
        # `db.migrations --verify` exists to catch.
        run: python -m db.migrations
        working-directory: nextxr-ontology
      - name: Provision the historian
        # A plain MySQL table, not a Timescale hypertable — there is no
        # extension to create and no compression policy to apply.
        run: python -m tools.historian_provision --strict
        working-directory: nextxr-ontology
      - name: Confirm the MySQL backend actually resolved
        # Without this the job could pass on the per-task SQLite fallback and
        # nothing would ever test the production configuration.
        run: |
          python -m tools.historian_provision --check
          python -c "
          import sys; sys.path.insert(0, '.')
          import db, historian
          assert db.is_mysql(), db.dialect()
          assert historian.backend() == 'mysql', historian.backend()
          print('db:', db.dialect(), '| historian:', historian.backend())
          "
        working-directory: nextxr-ontology

      - name: The integration marker must select tests
        # THE BUG THIS EXISTS FOR: nothing was marked `integration`, so the step
        # below selected 0 of 366 tests and pytest exited 5 ("no tests
        # collected"). The job failed for its whole existence while proving
        # nothing about the production backend. An empty selection is now its own
        # failure with its own message, so a future rename cannot quietly turn
        # this job back into a no-op.
        run: |
          COLLECTED=$(python -m pytest -m integration --collect-only -q 2>/dev/null \
            | grep -cE '^tests/' || true)
          echo "integration tests collected: $COLLECTED"
          if [ "$COLLECTED" -lt 1 ]; then
            echo "::error::No tests carry the 'integration' marker. This job cannot prove anything — see tests/test_integration_stores.py."
            exit 1
          fi

      - name: Run integration tests
        # A SKIP IS A FAILURE HERE. Every one of these tests skips when its store
        # is absent, so `pytest -m integration` stays quiet on a laptop with
        # nothing running. In this job the stores ARE present, so a skip means the
        # URL never reached the test — and the job would go green having tested
        # nothing, which is the same failure the collection guard above catches,
        # one level further down.
        run: |
          set -o pipefail
          python -m pytest -m integration -v -ra --no-header | tee /tmp/integration.log
          if grep -qE '[0-9]+ skipped' /tmp/integration.log; then
            echo "::error::An integration test skipped while its store was running. The store URL is not reaching the test — see the 'SKIPPED' reasons above."
            exit 1
          fi

      - name: Boot the app in production posture
        # A smoke test of _preflight(): with every REQUIRE flag set and every
        # dependency present, the app must come up and report healthy.
        run: |
          python -m uvicorn server.main:app --host 127.0.0.1 --port 8080 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/api/v1/health > /tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          python -c "
          import json
          h = json.load(open('/tmp/health.json'))
          assert h['historian']['backend'] == 'mysql', h['historian']
          assert h['database']['backend'] == 'mysql', h['database']
          assert h['bus']['backend'] == 'redis', h['bus']
          print('posture OK:', h['status'])
          "
        working-directory: nextxr-ontology
        env:
          NXR_API_KEYS: '[{"key":"ci-admin","tenant":"*","role":"admin","name":"CI"}]'
          # Mandatory while auth is enforced: the app refuses to boot with an
          # ephemeral signing key, which is the same guard a real deploy hits.
          NXR_JWT_SECRET: ci-jwt-secret-not-used-outside-this-job

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci || npm install
        working-directory: frontend
      # A broken build is currently only discovered when someone deploys, because
      # the API serves a placeholder page instead of failing when frontend/dist is
      # missing. That is the right runtime behaviour and the wrong CI behaviour.
      - name: Build
        run: npm run build
        working-directory: frontend
