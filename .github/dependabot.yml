# dependabot.yml — the other half of pinning.
#
# `requirements.txt` is now fully pinned, which fixes reproducibility and creates
# a new problem: pinned dependencies go stale, and a stale dependency with a CVE
# is worse than an unpinned one. This is what keeps them moving — as reviewable
# pull requests that run the full test suite, rather than silently at build time.
#
# GROUPED ON PURPOSE. Ten separate patch-bump PRs a week is noise people learn to
# rubber-stamp, which defeats the review. One grouped PR per ecosystem per week
# is a thing someone actually reads.

version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-patch:
        patterns: ["*"]
        update-types: ["patch"]
      python-minor:
        patterns: ["*"]
        update-types: ["minor"]
    # Majors stay individual: they are the ones with breaking changes, and they
    # deserve to be read on their own.
    labels: ["dependencies", "python"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-patch:
        patterns: ["*"]
        update-types: ["patch"]
      npm-minor:
        patterns: ["*"]
        update-types: ["minor"]
    ignore:
      # three and @react-three/* are pinned to a working trio; a minor bump to
      # one without the others breaks the 3-D viewer at runtime rather than at
      # build time, which CI would not catch.
      - dependency-name: "three"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "@react-three/*"
        update-types: ["version-update:semver-minor"]
    labels: ["dependencies", "frontend"]

  # The actions themselves. A pinned action tag is a supply-chain dependency
  # exactly like a package, and it runs with the repository's OIDC permissions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "ci"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "docker"]
