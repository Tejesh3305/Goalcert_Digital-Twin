

services:
  neo4j:
    image: neo4j:5-community
    container_name: nxr-neo4j
    ports:
      - "7474:7474"   # browser UI
      - "7687:7687"   # bolt driver
    environment:
      NEO4J_AUTH: neo4j/nextxr2026
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "nextxr2026", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nxr-server
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: nextxr2026

volumes:
  neo4j_data:
