

services:
  neo4j:
    image: neo4j:5-community
    container_name: nxr-neo4j
    ports:
      - "7474:7474"   # browser UI
      - "7687:7687"   # bolt driver
    environment:
      # Override the password via a NEO4J_PASSWORD env var (or an .env file next to
      # this compose file). Defaults to the local dev value so nothing breaks.
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-nextxr2026}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-nextxr2026}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # The relational store: twin registry, change log, identity/auth, agent
  # bundles, agent checkpoints, the BIM scene cache and the telemetry historian.
  # Matches the RDS engine (MySQL 8) so a local run exercises the same dialect the
  # deploy does (AWS_DEPLOYMENT.md §7).
  #
  # OPTIONAL locally. With NXR_DATABASE_URL unset the app uses SQLite files under
  # nextxr-ontology/data/ exactly as before, so nothing here is required to work
  # offline. Point at it with:
  #   $env:NXR_DATABASE_URL="mysql://nextxr:nextxr2026@localhost:3306/nextxr"
  #
  # If you already run MySQL natively it owns host port 3306 and this container
  # cannot bind it. Set MYSQL_PORT=3307 (and use that port in the URL) instead of
  # stopping yours.
  #
  # MySQL 8 is required (not 5.7 / MariaDB): the historian's "latest value" and
  # rollup queries use window functions (ROW_NUMBER() OVER …) that only exist in 8.
  mysql:
    image: mysql:8
    container_name: nxr-mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-nextxr2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nextxr}
      MYSQL_USER: ${MYSQL_USER:-nextxr}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nextxr2026}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-nextxr2026}"]
      interval: 10s
      timeout: 5s
      retries: 15

  # HOST PORT IS OVERRIDABLE, for the same reason MySQL's is above: 6379 is a
  # popular port. If anything else on the machine already owns it — another
  # compose stack, a native Redis — this container's publish silently produces
  # NO binding at all rather than an error, and `localhost:6379` then reaches
  # THAT other Redis. The twin appears to have a working bus while writing its
  # streams into a stranger's database.
  #
  # Set REDIS_PORT=6380 (and NXR_REDIS_URL=redis://localhost:6380/0) to run
  # alongside one, instead of stopping it.
  redis:
    image: redis:7-alpine
    container_name: nxr-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"   # event bus (Redis Streams)
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Stands in for S3: the blob store for generated GLBs and 3-D job artifacts.
  # MinIO speaks the S3 API, so the SAME storage/ code path runs locally as in
  # production — the only difference is NXR_S3_ENDPOINT_URL. Console on :9001
  # (nextxr / nextxr2026).
  #
  # OPTIONAL locally: with NXR_S3_BUCKET unset the blob store writes files under
  # nextxr-ontology/data/blobs/ instead, so offline work needs none of this.
  minio:
    image: minio/minio:latest
    container_name: nxr-minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nextxr}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nextxr2026}
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Creates the bucket once MinIO is up, so `docker compose up -d` leaves a
  # ready-to-use blob store rather than a bucket-not-found on first upload.
  minio-init:
    image: minio/mc:latest
    container_name: nxr-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-nextxr} ${MINIO_ROOT_PASSWORD:-nextxr2026} &&
      mc mb --ignore-existing local/${NXR_S3_BUCKET:-nextxr-blobs} &&
      echo 'bucket ready: ${NXR_S3_BUCKET:-nextxr-blobs}'
      "
    restart: "no"

  # The server runs in a container ONLY when you opt in with the "full" profile:
  #     docker compose --profile full up -d
  # By default `docker compose up -d` starts just Neo4j + Redis, and you run the
  # backend locally with `python -m server.main` (live code, no image rebuild).
  # This avoids a stale-image container grabbing port 8080 out from under your
  # local server — the cause of the "old code / Driver closed" confusion.
  # NOTE: when using this profile, rebuild after code changes:
  #     docker compose --profile full up -d --build
  server:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nxr-server
    ports:
      - "8080:8080"
    depends_on:
      neo4j:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-nextxr2026}
      # ── The three shared stores. This block mirrors the ECS task definition:
      #    MySQL = records, MinIO/S3 = blobs, Redis = live events.
      NXR_DATABASE_URL: mysql://${MYSQL_USER:-nextxr}:${MYSQL_PASSWORD:-nextxr2026}@mysql:3306/${MYSQL_DATABASE:-nextxr}
      NXR_REDIS_URL: redis://redis:6379/0
      NXR_S3_BUCKET: ${NXR_S3_BUCKET:-nextxr-blobs}
      NXR_S3_ENDPOINT_URL: http://minio:9000
      NXR_S3_ADDRESSING_STYLE: path        # MinIO needs path-style
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-nextxr}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-nextxr2026}
      AWS_REGION: us-east-1
      # ── Production posture: refuse to start on a per-task fallback. This is
      #    what makes the compose stack a faithful rehearsal of the deploy.
      NXR_REQUIRE_DB: "1"
      NXR_REQUIRE_S3: "1"
      NXR_REQUIRE_REDIS: "1"

volumes:
  neo4j_data:
  mysql_data:
  redis_data:
  minio_data:
